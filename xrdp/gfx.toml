[codec]
order = [ "H.264", "RFX" ]

# Select "x264", "OpenH264", or "ffmpeg". This matters only when more than
# one encoder was enabled at build time. The external ffmpeg backend requires
# xorgxrdp from the same paired release. See gfx.toml(5) for the full contract.
h264_encoder = "x264"

# -----------------------------------------------------------------------------
# External ffmpeg AVC444/AVC420 backend. To enable it, uncomment the table and
# set h264_encoder = "ffmpeg" above. Changes take effect at the next login.
# Defaults are shown explicitly; leave sparse chroma disabled unless its
# documented bandwidth/quality tradeoff is acceptable for the deployment.
# -----------------------------------------------------------------------------
# [avc444_ffmpeg]
# path = "/usr/bin/ffmpeg"
# # auto is recommended. Forced 444v1 is for legacy interoperability only;
# # qualified macOS clients may render fine chroma detail incorrectly.
# avc_mode = "auto"
# chroma_align = 32
# # Set dump_extra=true only for an encoder such as h264_nvenc which keeps
# # SPS/PPS in global extradata. The connection probe rejects a mismatch.
# dump_extra = false
# strip_sei = false
# sanitize_hrd = false
# strip_pic_struct = false
# # The long-term-reference path is required by eager acknowledgement and
# # sparse chroma. Its refresh and re-key defaults are shown below.
# aux_ltr_chain = false
# intra_refresh_frames = 250
# # Omit intra_refresh_frames_aux to follow the main interval.
# ltr_rekey_frame_num = 65024
# ltr_rekey_surface_reset = false
# eager_slot_ack = true
# wire_window = 1
# # Zero keeps full chroma on every AVC444 frame. Nonzero refresh/idle enables
# # sparse chroma and requires aux_ltr_chain=true. During recurrent damage,
# # fine chroma may visibly alternate between 4:2:0 and 4:4:4; after damage
# # stops, the final surface is restored to full chroma.
# chroma_refresh_ms = 0
# chroma_idle_ms = 0
# # The software block favors low CPU delay over compression: -bf 0 and
# # zerolatency prevent frame reordering/withholding, while CRF 18 sets quality.
# # The remaining values are stream contracts, not optional tuning: periodic
# # IDRs repeat SPS/PPS, AUD marks each access unit, and the AVC444
# # auxiliary-leaf transform requires CABAC rather than ultrafast's CAVLC.
# encoder_args = [
#   "-c:v", "libx264",
#   "-bf", "0",
#   "-preset", "ultrafast",
#   "-tune", "zerolatency",
#   "-crf", "18",
#   "-g", "240",
#   "-x264-params", "repeat-headers=1:aud=1:cabac=1",
# ]
#
# VAAPI example (Intel/AMD render node). Replace encoder_args above with:
# encoder_args = [
#   "-vaapi_device", "/dev/dri/renderD128",
#   "-vf", "format=nv12,hwupload",
#   "-c:v", "h264_vaapi",
#   "-rc_mode", "CQP", "-qp", "20",
#   "-bf", "0", "-async_depth", "1",
# ]
#
# NVENC example (NVIDIA). h264_nvenc keeps SPS/PPS in global extradata, so
# dump_extra=true is required with these arguments:
# dump_extra = true
# encoder_args = [
#   "-c:v", "h264_nvenc", "-preset", "p1", "-tune", "ll",
#   "-rc", "constqp", "-qp", "20", "-bf", "0", "-delay", "0", "-g", "240",
# ]

#
# Configurations for x264
#
[x264.default]
# NOTE: x264 specifies bitrate in unit of kbps.
preset = "ultrafast"
tune = "zerolatency"
profile = "main"     # profile is forced to baseline if preset == ultrafast
vbv_max_bitrate = 0
vbv_buffer_size = 0
fps_num = 60
fps_den = 1
threads = 1          # recommended: 1 or 2, see `man gfx.toml` for details

[x264.lan]
# inherits default

[x264.wan]
vbv_max_bitrate = 15_000
vbv_buffer_size = 1_500

[x264.broadband_high]
preset = "superfast"
vbv_max_bitrate = 8_000
vbv_buffer_Size = 800

[x264.satellite]
preset = "superfast"
vbv_max_bitrate = 5_000
vbv_buffer_size = 500

[x264.broadband_low]
preset = "veryfast"
vbv_max_bitrate = 1_600
vbv_buffer_size = 66

[x264.modem]
preset = "fast"
vbv_max_bitrate = 1_200
vbv_buffer_size = 50

#
# Configurations for OpenH264
#
[OpenH264.default]
# NOTE: OpenH264 specifies bitrate in unit of bps, not kbps.
EnableFrameSkip = false
TargetBitrate = 20_000_000
MaxBitrate =    0          # unspecified
MaxFrameRate = 60.0

[OpenH264.lan]
# inherits default

[OpenH264.wan]
TargetBitrate = 10_000_000
MaxBitrate =    12_000_000

[OpenH264.broadband_high]
EnableFrameSkip = true
TargetBitrate = 8_000_000
MaxBitrate =   10_000_000

[OpenH264.satellite]
EnableFrameSkip = true
TargetBitrate = 4_000_000
MaxBitrate =    6_000_000

[OpenH264.broadband_low]
EnableFrameSkip = true
TargetBitrate = 1_600_000
MaxBitrate =    1_800_000

[OpenH264.modem]
EnableFrameSkip = true
TargetBitrate =   600_000
MaxBitrate =    1_200_000
