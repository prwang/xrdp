[codec]
order = [ "H.264", "RFX" ]

# Specify a preferred H.264 encoder: "x264", "OpenH264", or "ffmpeg".
# This parameter takes effect only when more than one encoder is
# enabled at compile time. If only one encoder is enabled, the encoder
# will be used regardless the value of this parameter.
#
# "ffmpeg" selects the external stock-ffmpeg AVC444/AVC420 backend (no linked
# codec library). It encodes MS-RDPEGFX AVC444 v2 (0x000F) / AVC420 (0x000B)
# via a stock `ffmpeg` child, and needs the matching xorgxrdp (>= the
# CC_GFX_AVC444 capture) installed. See `man 5 gfx.toml` for the full contract.
h264_encoder = "x264"

# -----------------------------------------------------------------------------
# External stock-ffmpeg AVC444/AVC420 backend. Uncomment [avc444_ffmpeg] AND set
# h264_encoder = "ffmpeg" above to enable it. The encoder line (-c:v + tuning)
# is passed verbatim to ffmpeg, so any encoder ffmpeg has works with no xrdp
# change. The block below is the software (libx264) default; a hardware (VAAPI)
# example follows.
# -----------------------------------------------------------------------------
# NOTE: changes to this block take effect at the next fresh LOGIN
# (logoff -> login), not on disconnect/reconnect to an existing session.
# [avc444_ffmpeg]
# path = "/usr/bin/ffmpeg"
# # avc_mode: "auto" (prefer AVC444, else AVC420) | "444" | "420" (force 420,
# # e.g. to exercise 420 on mstsc, which always advertises AVC444) | "444v1"
# # (AVC444 with codec id 0x000E even for v2-capable clients -- per-client
# # compatibility knob; e.g. the macOS Windows App mis-renders v2/ChromaV2).
# # Default auto.
# avc_mode = "auto"
# # dump_extra: STATIC in-band parameter-set policy; set it to match the
# # encoder chosen in encoder_args (default false).
# #   false: the encoder itself repeats SPS/PPS in-band on every keyframe
# #          (libx264 with repeat-headers=1, h264_vaapi).
# #   true:  the encoder emits parameter sets only as global extradata
# #          (h264_nvenc); the dump_extra bitstream filter reinserts them.
# # The pre-connect verification refuses the AVC candidate LOUDLY when the
# # declared value does not match the encoder's real bitstream (missing or
# # duplicated SPS -- duplicates black out strict decoders such as the macOS
# # Windows App). The value is never adapted at runtime.
# dump_extra = false
# # tail_flush: legacy backstop, off by default and normally unnecessary. The
# # historical "last frame withheld until next input" lag was a runner bug
# # (stale content emitted under the current damage region) fixed by the now-
# # synchronous encode; nothing is left in flight, so this drain no-ops. The
# # synchronous encode needs a zero-latency encoder pipeline (libx264
# # -tune zerolatency, or h264_vaapi -async_depth 1); a deeper pipeline fails
# # loudly at encode instead of lagging silently. To diagnose frame delivery,
# # start xrdp with XRDP_GFX_TRACE=1 and read the GFX_TRACE lines in the log.
# tail_flush = false
# encoder_args = [
#   "-c:v", "libx264",
#   "-bf", "0",
#   "-preset", "ultrafast",
#   "-tune", "zerolatency",
#   "-crf", "18",
#   "-g", "240",
#   "-x264-params", "repeat-headers=1",
# ]
#
# Hardware H.264 via VAAPI (Intel/AMD render node). ffmpeg runs as root under
# xrdp so it can open the render node; frames arrive as system-memory NV12 and
# are uploaded to the GPU (-vf format=nv12,hwupload) before h264_vaapi. Replace
# the encoder_args above with:
# encoder_args = [
#   "-vaapi_device", "/dev/dri/renderD128",
#   "-vf", "format=nv12,hwupload",
#   "-c:v", "h264_vaapi",
#   "-rc_mode", "CQP", "-qp", "20",
#   "-bf", "0", "-async_depth", "1",
# ]
#
# Hardware H.264 via NVENC (NVIDIA). Tested: Tesla T4, driver 580.159.03,
# Ubuntu ffmpeg 8.0.1, 2026-07-26. h264_nvenc keeps SPS/PPS in global
# extradata only, so dump_extra = true is REQUIRED with these args:
# dump_extra = true
# encoder_args = [
#   "-c:v", "h264_nvenc", "-preset", "p1", "-tune", "ll",
#   "-rc", "constqp", "-qp", "20", "-bf", "0", "-delay", "0", "-g", "240",
# ]

#
# Configurations for x264
#
[x264.default]
# NOTE: x264 specifies bitrate in unit of kbps.
preset = "ultrafast"
tune = "zerolatency"
profile = "main"     # profile is forced to baseline if preset == ultrafast
vbv_max_bitrate = 0
vbv_buffer_size = 0
fps_num = 60
fps_den = 1
threads = 1          # recommended: 1 or 2, see `man gfx.toml` for details

[x264.lan]
# inherits default

[x264.wan]
vbv_max_bitrate = 15_000
vbv_buffer_size = 1_500

[x264.broadband_high]
preset = "superfast"
vbv_max_bitrate = 8_000
vbv_buffer_Size = 800

[x264.satellite]
preset = "superfast"
vbv_max_bitrate = 5_000
vbv_buffer_size = 500

[x264.broadband_low]
preset = "veryfast"
vbv_max_bitrate = 1_600
vbv_buffer_size = 66

[x264.modem]
preset = "fast"
vbv_max_bitrate = 1_200
vbv_buffer_size = 50

#
# Configurations for OpenH264
#
[OpenH264.default]
# NOTE: OpenH264 specifies bitrate in unit of bps, not kbps.
EnableFrameSkip = false
TargetBitrate = 20_000_000
MaxBitrate =    0          # unspecified
MaxFrameRate = 60.0

[OpenH264.lan]
# inherits default

[OpenH264.wan]
TargetBitrate = 10_000_000
MaxBitrate =    12_000_000

[OpenH264.broadband_high]
EnableFrameSkip = true
TargetBitrate = 8_000_000
MaxBitrate =   10_000_000

[OpenH264.satellite]
EnableFrameSkip = true
TargetBitrate = 4_000_000
MaxBitrate =    6_000_000

[OpenH264.broadband_low]
EnableFrameSkip = true
TargetBitrate = 1_600_000
MaxBitrate =    1_800_000

[OpenH264.modem]
EnableFrameSkip = true
TargetBitrate =   600_000
MaxBitrate =    1_200_000

