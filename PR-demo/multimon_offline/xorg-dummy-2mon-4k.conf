# Headless CLIENT-side X server presenting the #45 E3 target layout: TWO
# monitors, 2560x1440 next to 3840x2400, for driving `xfreerdp /multimon`
# offscreen at the geometry the acceptance gate is measured at. Same
# xf86-video-dummy rig as xorg-dummy-2mon.conf (the 2x1024x768 default),
# only larger — see that file's header for the mechanism.
#
#   Xorg :96 -config PR-demo/multimon_offline/xorg-dummy-2mon-4k.conf -noreset
#   DISPLAY=:96 MM_MODE0=2560x1440_60 MM_MODE1=3840x2400R MM_POS1=2560x0 \
#       PR-demo/multimon_offline/setup_monitors.sh
#
# Virtual 6400x2400 = 2560 + 3840 wide, tallest monitor high; the 2560x1440
# output sits at the top-left so the two monitors share the y = 0 edge and a
# vertical sweep crosses the boundary within both (BACKLOG #45 E7).
#
# VideoRam covers the virtual framebuffer at 32bpp (6400*2400*4 = 61.4 MB)
# with room to spare; the dummy driver allocates from it and fails the mode
# set outright if it is short.
#
# The 3840x2400 modeline is CVT REDUCED BLANKING (592 MHz vs 794 MHz for
# standard CVT): the pixel clock is fictional on a dummy device, but a lower
# one stays inside conservative clock validation.

Section "Device"
    Identifier  "dummy"
    Driver      "dummy"
    Option      "NumberOfOutputs" "2"
    VideoRam    262144
EndSection

Section "Monitor"
    Identifier  "mon0"
    Modeline "2560x1440_60.00"  312.25  2560 2752 3024 3488  1440 1443 1448 1493 -hsync +vsync
    Modeline "3840x2400R"  592.25  3840 3888 3920 4000  2400 2403 2409 2469 +hsync -vsync
EndSection

Section "Screen"
    Identifier  "screen0"
    Device      "dummy"
    Monitor     "mon0"
    DefaultDepth 24
    SubSection  "Display"
        Depth   24
        Modes   "3840x2400R" "2560x1440_60.00"
        Virtual 6400 2400
    EndSubSection
EndSection
