# Headless CLIENT-side X server presenting TWO 1024x768 monitors, for driving
# `xfreerdp /multimon` in the offline multimonitor AVC444 test. Uses the
# xf86-video-dummy driver (>= 0.4.0, multi-output). No physical GPU needed.
#
#   apt-get install xserver-xorg-video-dummy
#   Xorg :95 -config PR-demo/multimon_offline/xorg-dummy-2mon.conf -noreset
#   DISPLAY=:95 PR-demo/multimon_offline/setup_monitors.sh   # -> 2 monitors
#
# The two outputs (DUMMY0, DUMMY1) are placed side by side to form a
# 2048x768 virtual desktop split into two 1024x768 RandR monitors, which
# xfreerdp reads via XRRGetMonitors and forwards to xrdp as a 2-monitor
# TS_MONITOR layout. An explicit 1024x768 Modeline is provided because the
# dummy driver's built-in mode list is not guaranteed to contain it by name.

Section "Device"
    Identifier  "dummy"
    Driver      "dummy"
    Option      "NumberOfOutputs" "2"
    VideoRam    65536
EndSection

Section "Monitor"
    Identifier  "mon0"
    # 1024x768 @ 60 Hz (CVT)
    Modeline "1024x768_60" 63.50 1024 1072 1176 1328 768 771 775 798 -hsync +vsync
EndSection

Section "Screen"
    Identifier  "screen0"
    Device      "dummy"
    Monitor     "mon0"
    DefaultDepth 24
    SubSection  "Display"
        Depth   24
        Modes   "1024x768_60"
        Virtual 2048 768
    EndSubSection
EndSection
