# Arm x015: BACKLOG #76 -- strict fif = 1, measured against x014 and
# nothing else.
#
# WHAT THIS ARM CHANGES, AND IT IS ONE THING. x014 (and every arm before
# it) ran with the shipped default XRDP_GFX_FRAMES_IN_FLIGHT = 2
# (xrdp/xrdp_encoder.c:51 DEFAULT_XRDP_GFX_FRAMES_IN_FLIGHT). That lets
# the server send frame N+1 before the client has acknowledged frame N --
# one frame of queue sitting in front of the display. This arm sets it to
# 1: the server may not send a frame until the previous one is
# acknowledged.
#
# SAME IMAGE as x014 (localhost/xrdp-bisect:73e4cb76d483.xx10fa3aa-tf --
# no rebuild, no new deb), SAME xorgxrdp, SAME gfx.toml body verified by
# diff, SAME payload, SAME client rig, SAME geometry. The ONLY variable
# is the environment variable below.
#
# MECHANISM CHECK BEFORE ANY RATE (quality gate 2). Every GFX_TRACE
# `send` record prints fif=. On x014 all 12300 of them read fif=2. On
# this arm they must read fif=1; if they do not, the env var did not
# reach xrdp_encoder_create() and the run is void, not slow.
#
# WHAT TO EXPECT, so a surprise is recognisable as one. fif=1 removes a
# frame of queue, so LATENCY should fall and THROUGHPUT should fall or
# hold. If throughput falls a lot, the ack round trip is on the critical
# path and the queue was doing real work; if it barely moves, x014's
# second credit was pure bufferbloat and should be retired as the
# default. Both outcomes are results.
#
# RDP endpoint on the host: 127.0.0.1:40032.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: xrdp-x015
  namespace: bisect-matrix
  labels:
    app: xrdp-bisect
    arm: x015
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      arm: x015
  template:
    metadata:
      labels:
        app: xrdp-bisect
        arm: x015
    spec:
      containers:
        - name: xrdp
          image: localhost/xrdp-bisect:73e4cb76d483.xx10fa3aa-tf
          imagePullPolicy: Never
          securityContext:
            privileged: true
          env:
            - name: SESSION_KIND
              value: "textflood"
            - name: ARM_LABEL
              value: "x015: #76 strict fif=1, x014 image+config exactly (port 40032)"
            - name: XRDP_GFX_FRAMES_IN_FLIGHT
              value: "1"
            - name: XRDP_GFX_TRACE
              value: "1"
            - name: XRDP_ACK_TRACE
              value: "1"
            - name: XRDP_PERF_TRACE
              value: "/var/log/xrdp-perf/enc"
          ports:
            - containerPort: 3389
              hostPort: 40032
              hostIP: 127.0.0.1
              protocol: TCP
          volumeMounts:
            - name: dshm
              mountPath: /dev/shm
            - name: dri
              mountPath: /dev/dri
            - name: matrix-cred
              mountPath: /run/matrix
              readOnly: true
            - name: gfx
              mountPath: /etc/xrdp/gfx.toml
              subPath: gfx.toml
            - name: banner
              mountPath: /usr/local/bin/banner.sh
              subPath: banner.sh
            - name: banner
              mountPath: /usr/local/share/code_corpus.ansi
              subPath: code_corpus.ansi
      volumes:
        - name: dshm
          # k8s defaults /dev/shm to 64Mi, which an AVC444 session blows
          # past instantly -- and an undersized tmpfs SIGBUSes Xorg
          # mid-session (2026-07-28 multimon incident). The capture arena
          # is exactly width*height*1.5 * 2 views * 2 slots, summed over
          # monitors: 9,437,184 B measured at 2x1024x768, 77,414,400 B
          # (73.8 MiB) at the #45 E3 target 2560x1440 + 3840x2400. 1Gi is
          # ~13.9x that -- deliberately flat and generous rather than
          # tuned, because the failure mode is a hard mid-session SIGBUS
          # and the memory is a tmpfs ceiling, not an allocation
          # (BACKLOG #45 recon gate R2, owner directive 2026-07-29).
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
        - name: dri
          hostPath:
            path: /dev/dri
        - name: matrix-cred
          hostPath:
            path: /etc/xrdp-matrix
            type: Directory
        - name: banner
          configMap:
            name: xrdp-banner
            defaultMode: 0o755
        - name: gfx
          configMap:
            name: xrdp-gfx-x015
