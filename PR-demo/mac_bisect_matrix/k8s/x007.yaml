# Arm x007: BACKLOG #61e — the UNTRACED TWIN of x006.
#
# Same image, same gfx.toml body, same SESSION_KIND, same geometry, same
# client. The ONLY difference from x006 is that XRDP_PERF_TRACE is NOT
# set here, so the perf sink never arms.
#
# This is the control for the instrument itself. The v1 tracer wrote
# every event through one shared FILE*; fprintf takes flockfile, so a
# second producing thread serialised the encoder worker against the main
# thread and moved the measured frame period from 40.4 ms to 135.3 ms --
# while producing a table that looked like a result. x003 could not
# expose that, because x003 has the sink armed too and merely happened
# to have one writer. Only trace-ARMED vs trace-DISARMED on the same
# build can, and that is this pair.
#
# The arm's PREVIOUS purpose (fresh pod + old deb, to separate "the
# instrumented deb is slow" from "a fresh pod is slow") was retired
# unrun: tools/avc444_pack_bench.c answered it inside the two existing
# pods in seconds (3.32 vs 3.23 ms/frame), and building a fleet arm to
# answer one bit is what the 2026-08-01 CLAUDE.md rule forbids.
#
# XRDP_GFX_TRACE / XRDP_ACK_TRACE stay set on BOTH arms: they are the
# LOG-based traces the gate's own analysis reads, they are present in
# every arm in this series, and holding them equal is what keeps the
# comparison about the perf sink alone.
#
# RDP endpoint on the host: 127.0.0.1:40029.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: xrdp-x007
  namespace: bisect-matrix
  labels:
    app: xrdp-bisect
    arm: x007
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      arm: x007
  template:
    metadata:
      labels:
        app: xrdp-bisect
        arm: x007
    spec:
      containers:
        - name: xrdp
          image: localhost/xrdp-bisect:2781220ae747.xx10fa3aa-tf
          imagePullPolicy: Never
          securityContext:
            privileged: true
          env:
            - name: SESSION_KIND
              value: "textflood"
            - name: ARM_LABEL
              value: "x007: #61e UNTRACED twin of x006 -- textflood + emit split=true, perf sink DISARMED (port 40029)"
            - name: XRDP_GFX_TRACE
              value: "1"
            - name: XRDP_ACK_TRACE
              value: "1"
          ports:
            - containerPort: 3389
              hostPort: 40029
              hostIP: 127.0.0.1
              protocol: TCP
          volumeMounts:
            - name: dshm
              mountPath: /dev/shm
            - name: dri
              mountPath: /dev/dri
            - name: matrix-cred
              mountPath: /run/matrix
              readOnly: true
            - name: gfx
              mountPath: /etc/xrdp/gfx.toml
              subPath: gfx.toml
            - name: banner
              mountPath: /usr/local/bin/banner.sh
              subPath: banner.sh
            - name: banner
              mountPath: /usr/local/share/code_corpus.ansi
              subPath: code_corpus.ansi
      volumes:
        - name: dshm
          # k8s defaults /dev/shm to 64Mi, which an AVC444 session blows
          # past instantly -- and an undersized tmpfs SIGBUSes Xorg
          # mid-session (2026-07-28 multimon incident). The capture arena
          # is exactly width*height*1.5 * 2 views * 2 slots, summed over
          # monitors: 9,437,184 B measured at 2x1024x768, 77,414,400 B
          # (73.8 MiB) at the #45 E3 target 2560x1440 + 3840x2400. 1Gi is
          # ~13.9x that -- deliberately flat and generous rather than
          # tuned, because the failure mode is a hard mid-session SIGBUS
          # and the memory is a tmpfs ceiling, not an allocation
          # (BACKLOG #45 recon gate R2, owner directive 2026-07-29).
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
        - name: dri
          hostPath:
            path: /dev/dri
        - name: matrix-cred
          hostPath:
            path: /etc/xrdp-matrix
            type: Directory
        - name: banner
          configMap:
            name: xrdp-banner
            defaultMode: 0o755
        - name: gfx
          configMap:
            name: xrdp-gfx-x007
