# Arm P (BACKLOG #48): the CHURN-MASKED re-key -- arm-o with
# config with ltr_rekey_frame_num lowered to 536, so the EGFX surface
# delete/create/map re-key boundary arrives every ~268 encoded frames.
# The image tag MUST be the #48 build (c78895f607da): the arm-n image
# does not contain gfx_emit_surface_reset or the settable threshold, and
# the first #48 build (e928914a0e93) carried the threshold in xrdp_encoder
# but never copied it into the per-frame encoder config -- it encoded
# 72698 pairs with ZERO boundaries. build_and_deploy.sh cross-checks this
# line against ARM_TAG and aborts on a mismatch.
# RDP endpoint on the host: 127.0.0.1:40015 (tester / host tester password).
# Image tag pins the xrdp-dev commit; gfx.toml comes from the committed
# gfx/arm-p.toml via ConfigMap xrdp-gfx-arm-p (created by build_and_deploy.sh).
# Privileged + /dev/dri hostPath: the pod's ffmpeg encodes via VAAPI on the
# host GPU, same as the host baseline instance.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: xrdp-arm-p
  namespace: bisect-matrix
  labels:
    app: xrdp-bisect
    arm: arm-p
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      arm: arm-p
  template:
    metadata:
      labels:
        app: xrdp-bisect
        arm: arm-p
    spec:
      containers:
        - name: xrdp
          image: localhost/xrdp-bisect:8f0994e20f5d.xx5b9650c-xfce
          imagePullPolicy: Never
          securityContext:
            privileged: true
          env:
            # NOT xfce: an idle desktop encodes ~nothing (measured
            # 2026-07-29: 8 AVC444 pairs in 90 s), so a boundary every 268
            # pairs would take hours to reach. "code" is the FR-H264-8
            # gate baseline -- deterministic line-scroll at 10 fps, so
            # boundaries land ~27 s apart and the pair rate is comparable
            # across runs.
            - name: SESSION_KIND
              value: "code"
            - name: ARM_LABEL
              value: "O: re-key boundary (ltr_rekey_frame_num=536) + LTR aux-chain  (port 40015)"
          ports:
            - containerPort: 3389
              hostPort: 40015
              hostIP: 127.0.0.1
              protocol: TCP
          volumeMounts:
            - name: dshm
              mountPath: /dev/shm
            - name: dri
              mountPath: /dev/dri
            - name: matrix-cred
              mountPath: /run/matrix
              readOnly: true
            - name: gfx
              mountPath: /etc/xrdp/gfx.toml
              subPath: gfx.toml
            - name: banner
              mountPath: /usr/local/bin/banner.sh
              subPath: banner.sh
            - name: banner
              mountPath: /usr/local/share/code_corpus.ansi
              subPath: code_corpus.ansi
      volumes:
        - name: dshm
          # k8s defaults /dev/shm to 64Mi; the packed-view AVC444
          # capture shmem (two slots x two views, all monitors) needs
          # ~74MB for a dual-4K layout -- an undersized tmpfs SIGBUSes
          # Xorg mid-session (2026-07-28 multimon incident)
          emptyDir:
            medium: Memory
            sizeLimit: 512Mi
        - name: dri
          hostPath:
            path: /dev/dri
        - name: matrix-cred
          hostPath:
            path: /etc/xrdp-matrix
            type: Directory
        - name: banner
          configMap:
            name: xrdp-banner
            defaultMode: 0o755
        - name: gfx
          configMap:
            name: xrdp-gfx-arm-p
