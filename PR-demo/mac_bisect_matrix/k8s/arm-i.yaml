# Bisect I: new pair + G CQP config + 444 + xfce4
# RDP endpoint on the host: 127.0.0.1:40008 (tester / host tester password).
# Image tag pins the xrdp-dev commit; gfx.toml comes from the committed
# gfx/arm-i.toml via ConfigMap xrdp-gfx-arm-i (created by build_and_deploy.sh).
# Privileged + /dev/dri hostPath: the pod's ffmpeg encodes via VAAPI on the
# host GPU, same as the host baseline instance.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: xrdp-arm-i
  namespace: bisect-matrix
  labels:
    app: xrdp-bisect
    arm: arm-i
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      arm: arm-i
  template:
    metadata:
      labels:
        app: xrdp-bisect
        arm: arm-i
    spec:
      containers:
        - name: xrdp
          image: localhost/xrdp-bisect:bd1ab35b791e-xfce
          imagePullPolicy: Never
          securityContext:
            privileged: true
          env:
            - name: SESSION_KIND
              value: "xfce"
            - name: ARM_LABEL
              value: "I: new pair + G CQP config + 444 + xfce4  (port 40008)"
          ports:
            - containerPort: 3389
              hostPort: 40008
              hostIP: 127.0.0.1
              protocol: TCP
          volumeMounts:
            - name: dri
              mountPath: /dev/dri
            - name: matrix-cred
              mountPath: /run/matrix
              readOnly: true
            - name: gfx
              mountPath: /etc/xrdp/gfx.toml
              subPath: gfx.toml
            - name: banner
              mountPath: /usr/local/bin/banner.sh
              subPath: banner.sh
            - name: banner
              mountPath: /usr/local/share/code_corpus.ansi
              subPath: code_corpus.ansi
      volumes:
        - name: dri
          hostPath:
            path: /dev/dri
        - name: matrix-cred
          hostPath:
            path: /etc/xrdp-matrix
            type: Directory
        - name: banner
          configMap:
            name: xrdp-banner
            defaultMode: 0o755
        - name: gfx
          configMap:
            name: xrdp-gfx-arm-i
