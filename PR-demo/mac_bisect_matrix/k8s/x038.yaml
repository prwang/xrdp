# Arm x038 -- BACKLOG #125 A1 trailing chroma restoration.
#
# Treatment for x034. Both arms use the same xorgxrdp, byte-identical
# gfx.toml, explicit sparse 1000/100 ms settings, fresh XFCE desktop,
# LXTerminal and ConfigMap-mounted current codescroll10.sh.
# x034 retains pre-fix xrdp 3ca17beaa84d; x038 uses committed xrdp
# 386ca6951a3d, whose source includes repair 23b6235d.
#
# No xterm resources or command-line appearance overrides are installed.
#
# One monitor at 3840x2400. RDP endpoint on the host: 127.0.0.1:40054.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: xrdp-x038
  namespace: bisect-matrix
  labels:
    app: xrdp-bisect
    arm: x038
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      arm: x038
  template:
    metadata:
      labels:
        app: xrdp-bisect
        arm: x038
    spec:
      containers:
        - name: xrdp
          image: localhost/xrdp-bisect:386ca6951a3d.xx10fa3aa23033-tf-xfce.p0796eea3
          imagePullPolicy: Never
          securityContext:
            privileged: true
          env:
            - name: SESSION_KIND
              value: "xfce"
            - name: ARM_LABEL
              value: "x038: #125 fixed trailing chroma restoration, sparse 1000/100 (port 40054)"
            - name: XRDP_GFX_FRAMES_IN_FLIGHT
              value: "2"
            - name: XRDP_GFX_TRACE
              value: "1"
            - name: XRDP_ACK_TRACE
              value: "1"
            - name: XRDP_PERF_TRACE
              value: "/var/log/xrdp-perf/enc"
          ports:
            - containerPort: 3389
              hostPort: 40054
              hostIP: 127.0.0.1
              protocol: TCP
          volumeMounts:
            - name: dshm
              mountPath: /dev/shm
            - name: dri
              mountPath: /dev/dri
            - name: matrix-cred
              mountPath: /run/matrix
              readOnly: true
            - name: gfx
              mountPath: /etc/xrdp/gfx.toml
              subPath: gfx.toml
            - name: banner
              mountPath: /usr/local/bin/banner.sh
              subPath: banner.sh
            - name: banner
              mountPath: /usr/local/bin/codescroll10.sh
              subPath: codescroll10.sh
            - name: banner
              mountPath: /usr/local/share/code_corpus.ansi
              subPath: code_corpus.ansi
      volumes:
        - name: dshm
          # k8s defaults /dev/shm to 64Mi, which an AVC444 session blows
          # past instantly -- and an undersized tmpfs SIGBUSes Xorg
          # mid-session (2026-07-28 multimon incident). The capture arena
          # is exactly width*height*1.5 * 2 views * 2 slots, summed over
          # monitors: 9,437,184 B measured at 2x1024x768, 77,414,400 B
          # (73.8 MiB) at the #45 E3 target 2560x1440 + 3840x2400. 1Gi is
          # ~13.9x that -- deliberately flat and generous rather than
          # tuned, because the failure mode is a hard mid-session SIGBUS
          # and the memory is a tmpfs ceiling, not an allocation
          # (BACKLOG #45 recon gate R2, owner directive 2026-07-29).
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
        - name: dri
          hostPath:
            path: /dev/dri
        - name: matrix-cred
          hostPath:
            path: /etc/xrdp-matrix
            type: Directory
        - name: banner
          configMap:
            name: xrdp-banner
            defaultMode: 0o755
        - name: gfx
          configMap:
            name: xrdp-gfx-x038
