# Arm x017: BACKLOG #78 -- x015 (strict fif = 1) on the INSTRUMENTED
# build that splits the worker's `pump` bracket.
#
# WHAT THIS ARM CHANGES, AND IT IS ONE THING. x015 measured pump at
# 26.7 ms (vs x014's 16.6) and could not say where inside FEED / ENCODE
# / DRAIN the 10 ms lives, because xrdp_encoder_ffmpeg.c had no trace
# points. This arm's xrdp deb (661ff5fc64fa) adds exactly two records
# per child per cycle on the existing perf ring: `feedend` (picture
# fully in the pipe -- input no longer paces the worker) and `outfirst`
# (first output byte since submit -- the child finished encoding).
# Config is x015's byte for byte: same gfx.toml body (diff-verified),
# same xorgxrdp, same payload, same client rig, same geometry, same
# XRDP_GFX_FRAMES_IN_FLIGHT=1.
#
# MECHANISM CHECKS BEFORE ANY RATE (quality gate 2). (a) Every GFX_TRACE
# `send` record must read fif=1, as on x015. (b) INTERNAL CONTROL: this
# arm's pump mean must reproduce x015's ~26.7 ms; if it does not, the
# instrument perturbed the measurement and the split is void. (c) The
# ring must show 2 feedend + 2 outfirst per batch cycle, seq-paired.
#
# WHAT THE SPLIT DECIDES (#76, owner-approved observe-only design,
# 2026-08-02). Trace archaeology refuted cold-pages and the 10 ms poll
# timeout; the surviving hypothesis is a sustained-duty operating-point
# drop (VCN/SCLK/FCLK DPM). Run A = this arm + 1 Hz host clock log;
# Run B = the UNTOUCHED x014 pod rerun with the same clock log. Clocks
# lower on this arm AND the inflation inside ENCODE => duty-driven
# clocks. Clocks equal => the split names the guilty stage instead.
#
# RDP endpoint on the host: 127.0.0.1:40033.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: xrdp-x017
  namespace: bisect-matrix
  labels:
    app: xrdp-bisect
    arm: x017
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      arm: x017
  template:
    metadata:
      labels:
        app: xrdp-bisect
        arm: x017
    spec:
      containers:
        - name: xrdp
          image: localhost/xrdp-bisect:661ff5fc64fa.xx10fa3aa-tf
          imagePullPolicy: Never
          securityContext:
            privileged: true
          env:
            - name: SESSION_KIND
              value: "textflood"
            - name: ARM_LABEL
              value: "x017: #78 pump-split instrument on strict fif=1 (port 40033)"
            - name: XRDP_GFX_FRAMES_IN_FLIGHT
              value: "1"
            - name: XRDP_GFX_TRACE
              value: "1"
            - name: XRDP_ACK_TRACE
              value: "1"
            - name: XRDP_PERF_TRACE
              value: "/var/log/xrdp-perf/enc"
          ports:
            - containerPort: 3389
              hostPort: 40033
              hostIP: 127.0.0.1
              protocol: TCP
          volumeMounts:
            - name: dshm
              mountPath: /dev/shm
            - name: dri
              mountPath: /dev/dri
            - name: matrix-cred
              mountPath: /run/matrix
              readOnly: true
            - name: gfx
              mountPath: /etc/xrdp/gfx.toml
              subPath: gfx.toml
            - name: banner
              mountPath: /usr/local/bin/banner.sh
              subPath: banner.sh
            - name: banner
              mountPath: /usr/local/share/code_corpus.ansi
              subPath: code_corpus.ansi
      volumes:
        - name: dshm
          # k8s defaults /dev/shm to 64Mi, which an AVC444 session blows
          # past instantly -- and an undersized tmpfs SIGBUSes Xorg
          # mid-session (2026-07-28 multimon incident). The capture arena
          # is exactly width*height*1.5 * 2 views * 2 slots, summed over
          # monitors: 9,437,184 B measured at 2x1024x768, 77,414,400 B
          # (73.8 MiB) at the #45 E3 target 2560x1440 + 3840x2400. 1Gi is
          # ~13.9x that -- deliberately flat and generous rather than
          # tuned, because the failure mode is a hard mid-session SIGBUS
          # and the memory is a tmpfs ceiling, not an allocation
          # (BACKLOG #45 recon gate R2, owner directive 2026-07-29).
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
        - name: dri
          hostPath:
            path: /dev/dri
        - name: matrix-cred
          hostPath:
            path: /etc/xrdp-matrix
            type: Directory
        - name: banner
          configMap:
            name: xrdp-banner
            defaultMode: 0o755
        - name: gfx
          configMap:
            name: xrdp-gfx-x017
