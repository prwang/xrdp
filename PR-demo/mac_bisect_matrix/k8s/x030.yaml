# Arm x030: BACKLOG #92 / PRD FR-H264-9 -- the SPARSE-AUX cadence.
#
# The AVC444 aux (chroma) view is sent when the screen settles
# (chroma_idle_ms = 100) and at least once a second whatever the screen
# is doing (chroma_refresh_ms = 1000); every other frame carries the
# luma view alone as an LC=1 PDU with no LC=2 behind it. The aux view is
# 44.8 % of the bytes and a second full-frame pack and encode, so this
# is the largest single byte lever the pipeline has.
#
# THE CONTROL IS THIS SAME ARM, ROLLED. The A/B changes only this arm's
# gfx.toml ConfigMap -- chroma_refresh_ms 0 (off, today's behaviour
# exactly) against 1000 -- interleaved off/on/off/on in one sitting.
# Same image, same xorgxrdp, same payload, same geometry, same client
# rig, same hour. An unchanged arm on this host has drifted 36.8 ->
# 41.8 ms across a single day (BACKLOG #88), so one leg each would not
# be readable against that drift.
#
# WHAT IS BUILT. xrdp 7b550f6ae87f -- the #92 implementation -- on the
# SAME xorgxrdp (10fa3aa23033) as every textflood arm from x014 to x029,
# so the archived numbers this arm is read against were taken with an
# identical capture side. One monitor at 3840x2400, SESSION_KIND=
# textflood, as the owner directed.
#
# XRDP_GFX_FRAMES_IN_FLIGHT = 2 is set for the same reason as on x021:
# this arm's ack path never reads it (the credit frontier is on), but it
# is what the 'send' perf record's sixth field carries, and pinning it
# to the same 2 keeps that field meaning the same thing as on every arm
# this one is compared with.
#
# RDP endpoint on the host: 127.0.0.1:40046.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: xrdp-x030
  namespace: bisect-matrix
  labels:
    app: xrdp-bisect
    arm: x030
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      arm: x030
  template:
    metadata:
      labels:
        app: xrdp-bisect
        arm: x030
    spec:
      containers:
        - name: xrdp
          image: localhost/xrdp-bisect:7b550f6ae87f.xx10fa3aa-tf.p2fde5531
          imagePullPolicy: Never
          securityContext:
            privileged: true
          env:
            - name: SESSION_KIND
              value: "textflood"
            - name: ARM_LABEL
              value: "x030: BACKLOG #92 sparse aux -- chroma when the screen settles, guaranteed once a second (port 40046)"
            - name: XRDP_GFX_FRAMES_IN_FLIGHT
              value: "2"
            - name: XRDP_GFX_TRACE
              value: "1"
            - name: XRDP_ACK_TRACE
              value: "1"
            - name: XRDP_PERF_TRACE
              value: "/var/log/xrdp-perf/enc"
          ports:
            - containerPort: 3389
              hostPort: 40046
              hostIP: 127.0.0.1
              protocol: TCP
          volumeMounts:
            - name: dshm
              mountPath: /dev/shm
            - name: dri
              mountPath: /dev/dri
            - name: matrix-cred
              mountPath: /run/matrix
              readOnly: true
            - name: gfx
              mountPath: /etc/xrdp/gfx.toml
              subPath: gfx.toml
            - name: banner
              mountPath: /usr/local/bin/banner.sh
              subPath: banner.sh
            - name: banner
              mountPath: /usr/local/share/code_corpus.ansi
              subPath: code_corpus.ansi
      volumes:
        - name: dshm
          # k8s defaults /dev/shm to 64Mi, which an AVC444 session blows
          # past instantly -- and an undersized tmpfs SIGBUSes Xorg
          # mid-session (2026-07-28 multimon incident). The capture arena
          # is exactly width*height*1.5 * 2 views * 2 slots, summed over
          # monitors: 9,437,184 B measured at 2x1024x768, 77,414,400 B
          # (73.8 MiB) at the #45 E3 target 2560x1440 + 3840x2400. 1Gi is
          # ~13.9x that -- deliberately flat and generous rather than
          # tuned, because the failure mode is a hard mid-session SIGBUS
          # and the memory is a tmpfs ceiling, not an allocation
          # (BACKLOG #45 recon gate R2, owner directive 2026-07-29).
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
        - name: dri
          hostPath:
            path: /dev/dri
        - name: matrix-cred
          hostPath:
            path: /etc/xrdp-matrix
            type: Directory
        - name: banner
          configMap:
            name: xrdp-banner
            defaultMode: 0o755
        - name: gfx
          configMap:
            name: xrdp-gfx-x030
