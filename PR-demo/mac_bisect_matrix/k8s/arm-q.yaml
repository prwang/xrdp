# Arm Q: the RECON arm for xrdp BACKLOG #45 recon gate R1 — "does a
# monitor's capture slot ever alternate at monitorCount = 2?".
#
# Encoder side is arm-n exactly (gfx/arm-q.toml is byte-identical to
# gfx/arm-n.toml below the header): VAAPI CQP 444 + LTR aux-chain. The
# ONLY difference in the whole arm is the xorgxrdp deb — 957fa794ebdc =
# 5b9650cafbc3 plus one recon-only LOG_LEVEL_INFO line per AVC444 send:
#   R1SLOT mon <n> shmem_offset <o> rect_id <r> rect_id_ack <a> max <m>
# which lands in the session Xorg log inside the pod. shmem_offset is
# the slot actually put on the wire, so "did monitor n's offset ever
# change" answers R1 directly.
#
# SESSION_KIND=code with a 2-monitor client gives the case R1 is about:
# a full-desktop xterm spanning BOTH monitors, so every scroll frame
# damages both and the deferred-update loop interleaves them. A single
# damaged monitor would make rect_id advance by 1 per send and alternate
# trivially — that is NOT the case under test.
#
# RDP endpoint on the host: 127.0.0.1:40016 (tester / host tester password).
# Retire this arm with the gate; it is not part of the steady-state matrix.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: xrdp-arm-q
  namespace: bisect-matrix
  labels:
    app: xrdp-bisect
    arm: arm-q
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      arm: arm-q
  template:
    metadata:
      labels:
        app: xrdp-bisect
        arm: arm-q
    spec:
      containers:
        - name: xrdp
          image: localhost/xrdp-bisect:34795577580b.xx957fa79
          imagePullPolicy: Never
          securityContext:
            privileged: true
          env:
            - name: SESSION_KIND
              value: "code"
            - name: ARM_LABEL
              value: "Q: RECON R1 capture-slot log (xorgxrdp 957fa79) + LTR aux-chain  (port 40016)"
          ports:
            - containerPort: 3389
              hostPort: 40016
              hostIP: 127.0.0.1
              protocol: TCP
          volumeMounts:
            - name: dshm
              mountPath: /dev/shm
            - name: dri
              mountPath: /dev/dri
            - name: matrix-cred
              mountPath: /run/matrix
              readOnly: true
            - name: gfx
              mountPath: /etc/xrdp/gfx.toml
              subPath: gfx.toml
            - name: banner
              mountPath: /usr/local/bin/banner.sh
              subPath: banner.sh
            - name: banner
              mountPath: /usr/local/share/code_corpus.ansi
              subPath: code_corpus.ansi
      volumes:
        - name: dshm
          # k8s defaults /dev/shm to 64Mi, which an AVC444 session blows
          # past instantly -- and an undersized tmpfs SIGBUSes Xorg
          # mid-session (2026-07-28 multimon incident). The capture arena
          # is exactly width*height*1.5 * 2 views * 2 slots, summed over
          # monitors: 9,437,184 B measured at 2x1024x768, 77,414,400 B
          # (73.8 MiB) at the #45 E3 target 2560x1440 + 3840x2400. 1Gi is
          # ~13.9x that -- deliberately flat and generous rather than
          # tuned, because the failure mode is a hard mid-session SIGBUS
          # and the memory is a tmpfs ceiling, not an allocation
          # (BACKLOG #45 recon gate R2, owner directive 2026-07-29).
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
        - name: dri
          hostPath:
            path: /dev/dri
        - name: matrix-cred
          hostPath:
            path: /etc/xrdp-matrix
            type: Directory
        - name: banner
          configMap:
            name: xrdp-banner
            defaultMode: 0o755
        - name: gfx
          configMap:
            name: xrdp-gfx-arm-q
