# Arm S: BACKLOG #52 / E5-2 — the #45 pair (xrdp steps 0-7 + the step-0
# log clock fix, xorgxrdp d77d05463e52) under the SATURATED payload.
#
# SESSION_KIND=codeflood is the whole point of this arm. Every earlier
# frame-interval measurement ran SESSION_KIND=code, a `sleep 0.1`
# metronome: E5 read 52.5 ms per send against a 51.1 ms baseline and the
# 2026-07-30 reassessment showed both were readings of that 10 Hz clock
# (per-monitor period p50 102 ms, 11.8 ms of service, worker 22% busy,
# every long gap exactly one skipped beat). codeflood removes the sleep,
# so damage arrives faster than the pipeline drains it and the send
# interval is the server's own.
#
# arm-t (:40019) is the controlled partner: xrdp WITHOUT steps 5+7, the
# SAME xorgxrdp, the same gfx.toml encoder block, the same payload. The
# E5-2 ratio is arm-t mean / arm-s mean.
#
# XRDP_GFX_TRACE=1 is part of the gate (the interval, the kids_armed
# histogram and the worker busy % are all read out of those lines);
# e_gate_run.sh refuses to judge a run without them.
#
# /dev/shm is 1 GiB: the capture arena at the E3 target geometry
# (2560x1440 + 3840x2400) is exactly w*h*1.5 * 2 views * 2 slots summed
# over monitors = 77,414,400 B (73.8 MiB), measured -- deliberately flat
# rather than tuned (recon gate R2, owner directive 2026-07-29).
#
# RDP endpoint on the host: 127.0.0.1:40018.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: xrdp-arm-s
  namespace: bisect-matrix
  labels:
    app: xrdp-bisect
    arm: arm-s
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      arm: arm-s
  template:
    metadata:
      labels:
        app: xrdp-bisect
        arm: arm-s
    spec:
      containers:
        - name: xrdp
          image: localhost/xrdp-bisect:52b8798839ad.xxd77d054
          imagePullPolicy: Never
          securityContext:
            privileged: true
          env:
            - name: SESSION_KIND
              value: "codeflood"
            - name: ARM_LABEL
              value: "S: E5-2 flood - #45 steps 0-7 (pump_set + 2-monitor batch)  (port 40018)"
            - name: XRDP_GFX_TRACE
              value: "1"
          ports:
            - containerPort: 3389
              hostPort: 40018
              hostIP: 127.0.0.1
              protocol: TCP
          volumeMounts:
            - name: dshm
              mountPath: /dev/shm
            - name: dri
              mountPath: /dev/dri
            - name: matrix-cred
              mountPath: /run/matrix
              readOnly: true
            - name: gfx
              mountPath: /etc/xrdp/gfx.toml
              subPath: gfx.toml
            - name: banner
              mountPath: /usr/local/bin/banner.sh
              subPath: banner.sh
            - name: banner
              mountPath: /usr/local/share/code_corpus.ansi
              subPath: code_corpus.ansi
      volumes:
        - name: dshm
          # k8s defaults /dev/shm to 64Mi, which an AVC444 session blows
          # past instantly -- and an undersized tmpfs SIGBUSes Xorg
          # mid-session (2026-07-28 multimon incident). The capture arena
          # is exactly width*height*1.5 * 2 views * 2 slots, summed over
          # monitors: 9,437,184 B measured at 2x1024x768, 77,414,400 B
          # (73.8 MiB) at the #45 E3 target 2560x1440 + 3840x2400. 1Gi is
          # ~13.9x that -- deliberately flat and generous rather than
          # tuned, because the failure mode is a hard mid-session SIGBUS
          # and the memory is a tmpfs ceiling, not an allocation
          # (BACKLOG #45 recon gate R2, owner directive 2026-07-29).
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
        - name: dri
          hostPath:
            path: /dev/dri
        - name: matrix-cred
          hostPath:
            path: /etc/xrdp-matrix
            type: Directory
        - name: banner
          configMap:
            name: xrdp-banner
            defaultMode: 0o755
        - name: gfx
          configMap:
            name: xrdp-gfx-arm-s
