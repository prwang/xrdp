# Bisect F: old build 52099149 + 444 (color probe)
# RDP endpoint on the host: 127.0.0.1:40005 (tester / host tester password).
# Image tag pins the xrdp-dev commit; gfx.toml comes from the committed
# gfx/arm-f.toml via ConfigMap xrdp-gfx-arm-f (created by build_and_deploy.sh).
# Privileged + /dev/dri hostPath: the pod's ffmpeg encodes via VAAPI on the
# host GPU, same as the host baseline instance.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: xrdp-arm-f
  namespace: bisect-matrix
  labels:
    app: xrdp-bisect
    arm: arm-f
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      arm: arm-f
  template:
    metadata:
      labels:
        app: xrdp-bisect
        arm: arm-f
    spec:
      containers:
        - name: xrdp
          image: localhost/xrdp-bisect:52099149
          imagePullPolicy: Never
          securityContext:
            privileged: true
          env:
            - name: ARM_LABEL
              value: "F: old build 52099149 + 444 (color probe)  (port 40005)"
          ports:
            - containerPort: 3389
              hostPort: 40005
              hostIP: 127.0.0.1
              protocol: TCP
          volumeMounts:
            - name: dri
              mountPath: /dev/dri
            - name: matrix-cred
              mountPath: /run/matrix
              readOnly: true
            - name: gfx
              mountPath: /etc/xrdp/gfx.toml
              subPath: gfx.toml
            - name: banner
              mountPath: /usr/local/bin/banner.sh
              subPath: banner.sh
      volumes:
        - name: dri
          hostPath:
            path: /dev/dri
        - name: matrix-cred
          hostPath:
            path: /etc/xrdp-matrix
            type: Directory
        - name: banner
          configMap:
            name: xrdp-banner
            defaultMode: 0o755
        - name: gfx
          configMap:
            name: xrdp-gfx-arm-f
