# Reconciled development red arm, built without performance tracing.
# One monitor at the client-selected size; host endpoint 127.0.0.1:40059.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: xrdp-x043
  namespace: bisect-matrix
  labels:
    app: xrdp-bisect
    arm: x043
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      arm: x043
  template:
    metadata:
      labels:
        app: xrdp-bisect
        arm: x043
    spec:
      containers:
        - name: xrdp
          image: localhost/xrdp-bisect:reconciled-8a22cb5-13740e5-u2404-xfce-notrace
          imagePullPolicy: Never
          securityContext:
            privileged: true
          env:
            - name: SESSION_KIND
              value: "xfce"
            - name: ARM_LABEL
              value: "Reconciled development resize red arm (port 40059)"
          ports:
            - containerPort: 3389
              hostPort: 40059
              hostIP: 127.0.0.1
              protocol: TCP
          volumeMounts:
            - name: dshm
              mountPath: /dev/shm
            - name: matrix-cred
              mountPath: /run/matrix
              readOnly: true
            - name: gfx
              mountPath: /etc/xrdp/gfx.toml
              subPath: gfx.toml
            - name: payloads
              mountPath: /usr/local/bin/codescroll10.sh
              subPath: codescroll10.sh
            - name: payloads
              mountPath: /usr/local/share/code_corpus.ansi
              subPath: code_corpus.ansi
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
        - name: matrix-cred
          hostPath:
            path: /etc/xrdp-matrix
            type: Directory
        - name: payloads
          configMap:
            name: xrdp-banner
            defaultMode: 0o755
        - name: gfx
          configMap:
            name: xrdp-gfx-x043
