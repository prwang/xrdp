# Arm x001: BACKLOG #70B — the EGFX assembly split, ARMED.
#
# Pairs with x002, which is the SAME xrdp deb and the SAME xorgxrdp deb
# with gfx.toml's emit_thread = false. The A/B isolates one thing: does
# moving the emit pass off the encoder worker raise throughput, and does
# it do so without changing what reaches the client.
#
# Both arms carry the perf-trace sink, so the arm-w stage table
# (pump 10.78, emit 5.96, subm 3.70, coll 3.22 ms per 32.56 ms cycle) is
# directly comparable -- and this arm should show `emit` LEAVING the
# worker's serial cycle rather than merely shrinking.
#
# What to check before quoting any rate (PRD FR-ACK-2, gate 2): the
# mechanism must have moved. emit_beg/emit_end must appear on a
# DIFFERENT tid from subm_*/pump_*/coll_*, and join_* must be present.
# If emit is still on the worker's tid, the knob did not apply and the
# rate means nothing.
#
# RDP endpoint on the host: 127.0.0.1:40023.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: xrdp-x001
  namespace: bisect-matrix
  labels:
    app: xrdp-bisect
    arm: x001
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      arm: x001
  template:
    metadata:
      labels:
        app: xrdp-bisect
        arm: x001
    spec:
      containers:
        - name: xrdp
          image: localhost/xrdp-bisect:4bbf11814323.xx10fa3aa
          imagePullPolicy: Never
          securityContext:
            privileged: true
          env:
            - name: SESSION_KIND
              value: "codeflood"
            - name: ARM_LABEL
              value: "x001: #70B emit split=true (port 40023)"
            - name: XRDP_GFX_TRACE
              value: "1"
            - name: XRDP_ACK_TRACE
              value: "1"
            - name: XRDP_PERF_TRACE
              value: "/var/log/xrdp-perf/enc"
          ports:
            - containerPort: 3389
              hostPort: 40023
              hostIP: 127.0.0.1
              protocol: TCP
          volumeMounts:
            - name: dshm
              mountPath: /dev/shm
            - name: dri
              mountPath: /dev/dri
            - name: matrix-cred
              mountPath: /run/matrix
              readOnly: true
            - name: gfx
              mountPath: /etc/xrdp/gfx.toml
              subPath: gfx.toml
            - name: banner
              mountPath: /usr/local/bin/banner.sh
              subPath: banner.sh
            - name: banner
              mountPath: /usr/local/share/code_corpus.ansi
              subPath: code_corpus.ansi
      volumes:
        - name: dshm
          # k8s defaults /dev/shm to 64Mi, which an AVC444 session blows
          # past instantly -- and an undersized tmpfs SIGBUSes Xorg
          # mid-session (2026-07-28 multimon incident). The capture arena
          # is exactly width*height*1.5 * 2 views * 2 slots, summed over
          # monitors: 9,437,184 B measured at 2x1024x768, 77,414,400 B
          # (73.8 MiB) at the #45 E3 target 2560x1440 + 3840x2400. 1Gi is
          # ~13.9x that -- deliberately flat and generous rather than
          # tuned, because the failure mode is a hard mid-session SIGBUS
          # and the memory is a tmpfs ceiling, not an allocation
          # (BACKLOG #45 recon gate R2, owner directive 2026-07-29).
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
        - name: dri
          hostPath:
            path: /dev/dri
        - name: matrix-cred
          hostPath:
            path: /etc/xrdp-matrix
            type: Directory
        - name: banner
          configMap:
            name: xrdp-banner
            defaultMode: 0o755
        - name: gfx
          configMap:
            name: xrdp-gfx-x001
