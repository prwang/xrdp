# Bisect A: baseline CQP (control-good)
# RDP endpoint on the host: 127.0.0.1:40000 (tester / host tester password).
# Image tag pins the xrdp-dev commit; gfx.toml comes from the committed
# gfx/arm-a.toml via ConfigMap xrdp-gfx-arm-a (created by build_and_deploy.sh).
# Privileged + /dev/dri hostPath: the pod's ffmpeg encodes via VAAPI on the
# host GPU, same as the host baseline instance.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: xrdp-arm-a
  namespace: bisect-matrix
  labels:
    app: xrdp-bisect
    arm: arm-a
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      arm: arm-a
  template:
    metadata:
      labels:
        app: xrdp-bisect
        arm: arm-a
    spec:
      containers:
        - name: xrdp
          image: localhost/xrdp-bisect:52099149
          imagePullPolicy: Never
          securityContext:
            privileged: true
          env:
            - name: ARM_LABEL
              value: "A: baseline CQP (control-good)  (port 40000)"
          ports:
            - containerPort: 3389
              hostPort: 40000
              hostIP: 127.0.0.1
              protocol: TCP
          volumeMounts:
            - name: dri
              mountPath: /dev/dri
            - name: matrix-cred
              mountPath: /run/matrix
              readOnly: true
            - name: gfx
              mountPath: /etc/xrdp/gfx.toml
              subPath: gfx.toml
      volumes:
        - name: dri
          hostPath:
            path: /dev/dri
        - name: matrix-cred
          hostPath:
            path: /etc/xrdp-matrix
            type: Directory
        - name: gfx
          configMap:
            name: xrdp-gfx-arm-a
