# Arm T: BACKLOG #52 / E5-2 BASELINE — xrdp at #45 steps 0-4 only
# (a0d9e773 + the step-0 log clock fix, bench branch
# bench/e52-arm-t-baseline), paired with the SAME xorgxrdp d77d05463e52
# as arm-s.
#
# This arm exists so E5-2 has a baseline measured under the SAME payload
# by the SAME instrument. The old 51.1 ms baseline was measured under the
# 10 Hz cadence payload (and its capture was never committed), so it
# cannot be the denominator for a flood run.
#
# Pairing the baseline xrdp with step 6's xorgxrdp is deliberate: the
# producer side is then identical on both arms and the A/B isolates
# exactly pump_set (step 5) and the two-monitor batch (step 7).
#
# SESSION_KIND=codeflood, XRDP_GFX_TRACE=1, geometry, gfx.toml encoder
# block and /dev/shm are all identical to arm-s -- see k8s/arm-s.yaml.
#
# RDP endpoint on the host: 127.0.0.1:40019.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: xrdp-arm-t
  namespace: bisect-matrix
  labels:
    app: xrdp-bisect
    arm: arm-t
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      arm: arm-t
  template:
    metadata:
      labels:
        app: xrdp-bisect
        arm: arm-t
    spec:
      containers:
        - name: xrdp
          image: localhost/xrdp-bisect:5dae11f63adb.xxd77d054
          imagePullPolicy: Never
          securityContext:
            privileged: true
          env:
            - name: SESSION_KIND
              value: "codeflood"
            - name: ARM_LABEL
              value: "T: E5-2 flood BASELINE - #45 steps 0-4, no pump_set  (port 40019)"
            - name: XRDP_GFX_TRACE
              value: "1"
          ports:
            - containerPort: 3389
              hostPort: 40019
              hostIP: 127.0.0.1
              protocol: TCP
          volumeMounts:
            - name: dshm
              mountPath: /dev/shm
            - name: dri
              mountPath: /dev/dri
            - name: matrix-cred
              mountPath: /run/matrix
              readOnly: true
            - name: gfx
              mountPath: /etc/xrdp/gfx.toml
              subPath: gfx.toml
            - name: banner
              mountPath: /usr/local/bin/banner.sh
              subPath: banner.sh
            - name: banner
              mountPath: /usr/local/share/code_corpus.ansi
              subPath: code_corpus.ansi
      volumes:
        - name: dshm
          # k8s defaults /dev/shm to 64Mi, which an AVC444 session blows
          # past instantly -- and an undersized tmpfs SIGBUSes Xorg
          # mid-session (2026-07-28 multimon incident). The capture arena
          # is exactly width*height*1.5 * 2 views * 2 slots, summed over
          # monitors: 9,437,184 B measured at 2x1024x768, 77,414,400 B
          # (73.8 MiB) at the #45 E3 target 2560x1440 + 3840x2400. 1Gi is
          # ~13.9x that -- deliberately flat and generous rather than
          # tuned, because the failure mode is a hard mid-session SIGBUS
          # and the memory is a tmpfs ceiling, not an allocation
          # (BACKLOG #45 recon gate R2, owner directive 2026-07-29).
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
        - name: dri
          hostPath:
            path: /dev/dri
        - name: matrix-cred
          hostPath:
            path: /etc/xrdp-matrix
            type: Directory
        - name: banner
          configMap:
            name: xrdp-banner
            defaultMode: 0o755
        - name: gfx
          configMap:
            name: xrdp-gfx-arm-t
