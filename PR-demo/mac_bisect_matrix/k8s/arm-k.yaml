# Bisect K: FAULT INJECTION one-frame aux slip + 444 + xfce4
# RDP endpoint on the host: 127.0.0.1:40010 (tester / host tester password).
# Image tag pins the xrdp-dev commit; gfx.toml comes from the committed
# gfx/arm-k.toml via ConfigMap xrdp-gfx-arm-k (created by build_and_deploy.sh).
# Privileged + /dev/dri hostPath: the pod's ffmpeg encodes via VAAPI on the
# host GPU, same as the host baseline instance.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: xrdp-arm-k
  namespace: bisect-matrix
  labels:
    app: xrdp-bisect
    arm: arm-k
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      arm: arm-k
  template:
    metadata:
      labels:
        app: xrdp-bisect
        arm: arm-k
    spec:
      containers:
        - name: xrdp
          image: localhost/xrdp-bisect:8b8d17c2636a-xfce
          imagePullPolicy: Never
          securityContext:
            privileged: true
          env:
            - name: SESSION_KIND
              value: "xfce"
            - name: ARM_LABEL
              value: "K: FAULT INJECTION one-frame aux slip + 444 + xfce4  (port 40010)"
          ports:
            - containerPort: 3389
              hostPort: 40010
              hostIP: 127.0.0.1
              protocol: TCP
          volumeMounts:
            - name: dshm
              mountPath: /dev/shm
            - name: dri
              mountPath: /dev/dri
            - name: matrix-cred
              mountPath: /run/matrix
              readOnly: true
            - name: gfx
              mountPath: /etc/xrdp/gfx.toml
              subPath: gfx.toml
            - name: banner
              mountPath: /usr/local/bin/banner.sh
              subPath: banner.sh
      volumes:
        - name: dshm
          # k8s defaults /dev/shm to 64Mi; the packed-view AVC444
          # capture shmem (two slots x two views, all monitors) needs
          # ~74MB for a dual-4K layout -- an undersized tmpfs SIGBUSes
          # Xorg mid-session (2026-07-28 multimon incident)
          emptyDir:
            medium: Memory
            sizeLimit: 512Mi
        - name: dri
          hostPath:
            path: /dev/dri
        - name: matrix-cred
          hostPath:
            path: /etc/xrdp-matrix
            type: Directory
        - name: banner
          configMap:
            name: xrdp-banner
            defaultMode: 0o755
        - name: gfx
          configMap:
            name: xrdp-gfx-arm-k
