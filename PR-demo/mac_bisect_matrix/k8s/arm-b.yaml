# Bisect B: CBR + timing SEI (M1, control-black)
# RDP endpoint on the host: 127.0.0.1:40001 (tester / host tester password).
# Image tag pins the xrdp-dev commit; gfx.toml comes from the committed
# gfx/arm-b.toml via ConfigMap xrdp-gfx-arm-b (created by build_and_deploy.sh).
# Privileged + /dev/dri hostPath: the pod's ffmpeg encodes via VAAPI on the
# host GPU, same as the host baseline instance.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: xrdp-arm-b
  namespace: bisect-matrix
  labels:
    app: xrdp-bisect
    arm: arm-b
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      arm: arm-b
  template:
    metadata:
      labels:
        app: xrdp-bisect
        arm: arm-b
    spec:
      containers:
        - name: xrdp
          image: localhost/xrdp-bisect:52099149
          imagePullPolicy: Never
          securityContext:
            privileged: true
          env:
            - name: ARM_LABEL
              value: "B: CBR + timing SEI (M1, control-black)  (port 40001)"
          ports:
            - containerPort: 3389
              hostPort: 40001
              hostIP: 127.0.0.1
              protocol: TCP
          volumeMounts:
            - name: dri
              mountPath: /dev/dri
            - name: matrix-cred
              mountPath: /run/matrix
              readOnly: true
            - name: gfx
              mountPath: /etc/xrdp/gfx.toml
              subPath: gfx.toml
            - name: banner
              mountPath: /usr/local/bin/banner.sh
              subPath: banner.sh
      volumes:
        - name: dri
          hostPath:
            path: /dev/dri
        - name: matrix-cred
          hostPath:
            path: /etc/xrdp-matrix
            type: Directory
        - name: banner
          configMap:
            name: xrdp-banner
            defaultMode: 0o755
        - name: gfx
          configMap:
            name: xrdp-gfx-arm-b
