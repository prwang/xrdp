# Arm x034 -- FRONTIER + SPARSE AUX. BACKLOG #104, the PR evidence matrix.
#
# x033 plus the sparse-chroma cadence (PRD FR-H264-9): the aux view is sent when the screen settles and at least once a second, and every other frame ships the luma view alone. The byte lever, measured against x033.
#
# ONE IMAGE ACROSS x031-x035. Every arm in this matrix is built from the
# SAME xrdp commit and the SAME xorgxrdp, and differs ONLY in its
# gfx.toml. That is the property the old fleet did not have -- 17 pods
# across five images, none comparable with another -- and it is what
# makes a cross-arm number evidence rather than an anecdote.
#
# SESSION_KIND=textflood_strip, NOT textflood. The slow payload runs at
# 16.2 ms/frame, which after the encoder-input-pipe fix is the same
# speed as the pipeline: an FR-BENCH-1 margin of 1.04x against the PRD's
# 2.0x floor, at which the gate voids overlap claims and a frame rate may
# be reporting the payload. The strip payload measured 4.5 ms/frame at
# this geometry (BACKLOG #83), a margin of 3.94x.
#
# One monitor at 3840x2400. RDP endpoint on the host: 127.0.0.1:40050.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: xrdp-x034
  namespace: bisect-matrix
  labels:
    app: xrdp-bisect
    arm: x034
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      arm: x034
  template:
    metadata:
      labels:
        app: xrdp-bisect
        arm: x034
    spec:
      containers:
        - name: xrdp
          image: localhost/xrdp-bisect:3ca17beaa84d.xx10fa3aa-tf.p2fde5531
          imagePullPolicy: Never
          securityContext:
            privileged: true
          env:
            - name: SESSION_KIND
              value: "textflood_strip"
            - name: ARM_LABEL
              value: "x034: BACKLOG #92 sparse aux -- chroma when the screen settles, guaranteed once a second (port 40050)"
            - name: XRDP_GFX_FRAMES_IN_FLIGHT
              value: "2"
            - name: XRDP_GFX_TRACE
              value: "1"
            - name: XRDP_ACK_TRACE
              value: "1"
            - name: XRDP_PERF_TRACE
              value: "/var/log/xrdp-perf/enc"
          ports:
            - containerPort: 3389
              hostPort: 40050
              hostIP: 127.0.0.1
              protocol: TCP
          volumeMounts:
            - name: dshm
              mountPath: /dev/shm
            - name: dri
              mountPath: /dev/dri
            - name: matrix-cred
              mountPath: /run/matrix
              readOnly: true
            - name: gfx
              mountPath: /etc/xrdp/gfx.toml
              subPath: gfx.toml
            - name: banner
              mountPath: /usr/local/bin/banner.sh
              subPath: banner.sh
            - name: banner
              mountPath: /usr/local/share/code_corpus.ansi
              subPath: code_corpus.ansi
      volumes:
        - name: dshm
          # k8s defaults /dev/shm to 64Mi, which an AVC444 session blows
          # past instantly -- and an undersized tmpfs SIGBUSes Xorg
          # mid-session (2026-07-28 multimon incident). The capture arena
          # is exactly width*height*1.5 * 2 views * 2 slots, summed over
          # monitors: 9,437,184 B measured at 2x1024x768, 77,414,400 B
          # (73.8 MiB) at the #45 E3 target 2560x1440 + 3840x2400. 1Gi is
          # ~13.9x that -- deliberately flat and generous rather than
          # tuned, because the failure mode is a hard mid-session SIGBUS
          # and the memory is a tmpfs ceiling, not an allocation
          # (BACKLOG #45 recon gate R2, owner directive 2026-07-29).
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
        - name: dri
          hostPath:
            path: /dev/dri
        - name: matrix-cred
          hostPath:
            path: /etc/xrdp-matrix
            type: Directory
        - name: banner
          configMap:
            name: xrdp-banner
            defaultMode: 0o755
        - name: gfx
          configMap:
            name: xrdp-gfx-x034
