# Arm V: BACKLOG #70 EAGER — the same pair with eager_slot_ack = true.
#
# The capture slot is released when the encoder children have absorbed
# the frame (collect returned, so the vmsplice'd pages are read) AND
# the previous frame's last PDU has gone to the transport, instead of
# after this frame's own last write. Everything else is arm-u.
#
# CI (174/174, commit 348a16dde3f3) says this buys throughput only when
# the effective capture depth is ONE; with a healthy two-slot budget
# the shipped ack already reaches the worker floor. Which regime the
# deployment is in is what this arm and arm-u are here to measure.
#
# RDP endpoint on the host: 127.0.0.1:40021.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: xrdp-arm-v
  namespace: bisect-matrix
  labels:
    app: xrdp-bisect
    arm: arm-v
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      arm: arm-v
  template:
    metadata:
      labels:
        app: xrdp-bisect
        arm: arm-v
    spec:
      containers:
        - name: xrdp
          image: localhost/xrdp-bisect:348a16dde3f3.xx10fa3aa
          imagePullPolicy: Never
          securityContext:
            privileged: true
          env:
            - name: SESSION_KIND
              value: "codeflood"
            - name: ARM_LABEL
              value: "V: #70 EAGER - ack at max(absorb N, egress N-1) (port 40021)"
            - name: XRDP_GFX_TRACE
              value: "1"
            - name: XRDP_ACK_TRACE
              value: "1"
          ports:
            - containerPort: 3389
              hostPort: 40021
              hostIP: 127.0.0.1
              protocol: TCP
          volumeMounts:
            - name: dshm
              mountPath: /dev/shm
            - name: dri
              mountPath: /dev/dri
            - name: matrix-cred
              mountPath: /run/matrix
              readOnly: true
            - name: gfx
              mountPath: /etc/xrdp/gfx.toml
              subPath: gfx.toml
            - name: banner
              mountPath: /usr/local/bin/banner.sh
              subPath: banner.sh
            - name: banner
              mountPath: /usr/local/share/code_corpus.ansi
              subPath: code_corpus.ansi
      volumes:
        - name: dshm
          # k8s defaults /dev/shm to 64Mi, which an AVC444 session blows
          # past instantly -- and an undersized tmpfs SIGBUSes Xorg
          # mid-session (2026-07-28 multimon incident). The capture arena
          # is exactly width*height*1.5 * 2 views * 2 slots, summed over
          # monitors: 9,437,184 B measured at 2x1024x768, 77,414,400 B
          # (73.8 MiB) at the #45 E3 target 2560x1440 + 3840x2400. 1Gi is
          # ~13.9x that -- deliberately flat and generous rather than
          # tuned, because the failure mode is a hard mid-session SIGBUS
          # and the memory is a tmpfs ceiling, not an allocation
          # (BACKLOG #45 recon gate R2, owner directive 2026-07-29).
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
        - name: dri
          hostPath:
            path: /dev/dri
        - name: matrix-cred
          hostPath:
            path: /etc/xrdp-matrix
            type: Directory
        - name: banner
          configMap:
            name: xrdp-banner
            defaultMode: 0o755
        - name: gfx
          configMap:
            name: xrdp-gfx-arm-v
