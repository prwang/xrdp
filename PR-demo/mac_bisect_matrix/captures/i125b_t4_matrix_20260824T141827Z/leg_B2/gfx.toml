[codec]
order = [ "H.264", "RFX" ]
h264_encoder = "ffmpeg"

# NVIDIA low-latency AVC444v2 profile. Changes take effect at the next login.
# dump_extra and the three interoperability transforms are required by the
# qualified NVENC/macOS combination; they are not general encoder defaults.
[avc444_ffmpeg]
path = "/usr/bin/ffmpeg"
avc_mode = "444"
dump_extra = true
strip_sei = true
sanitize_hrd = true
strip_pic_struct = true
aux_ltr_chain = true
eager_slot_ack = true
wire_window = 1
# Dense chroma is the quality-preserving default. Benchmark sparse variants
# change only these two values to 1000 and 100 milliseconds respectively.
chroma_refresh_ms = 1000
chroma_idle_ms = 100
intra_refresh_frames = 240
# The runner appends a matching GOP interval; do not add -g here.
encoder_args = [
  "-c:v", "h264_nvenc", "-profile:v", "high", "-preset", "p1", "-tune", "ll",
  "-refs", "1", "-dpb_size", "1", "-rc", "constqp", "-qp", "20", "-bf", "0", "-delay", "0",
]
# VAAPI alternative (Intel/AMD render node):
# encoder_args = [
#   "-vaapi_device", "/dev/dri/renderD128",
#   "-vf", "format=nv12,hwupload",
#   "-c:v", "h264_vaapi",
#   "-rc_mode", "CQP", "-qp", "20",
#   "-bf", "0", "-async_depth", "1",
# ]

#
# Configurations for x264
#
[x264.default]
# NOTE: x264 specifies bitrate in unit of kbps.
preset = "ultrafast"
tune = "zerolatency"
profile = "main"     # profile is forced to baseline if preset == ultrafast
vbv_max_bitrate = 0
vbv_buffer_size = 0
fps_num = 60
fps_den = 1
threads = 1          # recommended: 1 or 2, see `man gfx.toml` for details

[x264.lan]
# inherits default

[x264.wan]
vbv_max_bitrate = 15_000
vbv_buffer_size = 1_500

[x264.broadband_high]
preset = "superfast"
vbv_max_bitrate = 8_000
vbv_buffer_Size = 800

[x264.satellite]
preset = "superfast"
vbv_max_bitrate = 5_000
vbv_buffer_size = 500

[x264.broadband_low]
preset = "veryfast"
vbv_max_bitrate = 1_600
vbv_buffer_size = 66

[x264.modem]
preset = "fast"
vbv_max_bitrate = 1_200
vbv_buffer_size = 50

#
# Configurations for OpenH264
#
[OpenH264.default]
# NOTE: OpenH264 specifies bitrate in unit of bps, not kbps.
EnableFrameSkip = false
TargetBitrate = 20_000_000
MaxBitrate =    0          # unspecified
MaxFrameRate = 60.0

[OpenH264.lan]
# inherits default

[OpenH264.wan]
TargetBitrate = 10_000_000
MaxBitrate =    12_000_000

[OpenH264.broadband_high]
EnableFrameSkip = true
TargetBitrate = 8_000_000
MaxBitrate =   10_000_000

[OpenH264.satellite]
EnableFrameSkip = true
TargetBitrate = 4_000_000
MaxBitrate =    6_000_000

[OpenH264.broadband_low]
EnableFrameSkip = true
TargetBitrate = 1_600_000
MaxBitrate =    1_800_000

[OpenH264.modem]
EnableFrameSkip = true
TargetBitrate =   600_000
MaxBitrate =    1_200_000
