# ARM x019 (host port 40035) — BACKLOG #80 step 4 / #81: the CREDIT FRONTIER
# measured on a simulated WAN. RTT for this arm: 40 ms, applied by tc netem on the pod veth pair.
#
# WHY THIS ARM EXISTS. #80 replaced the cross-layer gate
# — "withhold the producer's slot credit until the CLIENT acknowledges"
# — with a credit frontier whose three terms each consult their own
# layer:
#
#     credit = min(frame_id_consumed, frame_id_server + 1,
#                  frame_id_client + C)
#
# emitted unconditionally. Until now that code has never encoded a frame
# on a real link: every number for #80 came from CI or from captures of
# the OLD build. This arm is the first live measurement.
#
# WHAT DIFFERS FROM x017, AND IT IS TWO THINGS, ONE PER ARM PAIR.
#   (1) the xrdp deb: 1d5bc0960db8 (the credit frontier) instead of
#       661ff5fc64fa. Same xorgxrdp (10fa3aa23033 — #80 needed no
#       producer change), same gfx.toml body except the added
#       wire_window line, same payload, same geometry, same client rig.
#   (2) the RTT: applied by PR-demo/mac_bisect_matrix/netem_rtt.sh, not
#       by anything in this file or in the image. x018 runs at the
#       loopback baseline, x019 behind 40 ms of true round trip.
#
# MECHANISM CHECKS BEFORE ANY RATE (quality gate 2).
#   (a) every ackslot / ackregion perf record must read field e = 1
#       (the wire window C actually in force). If it reads 2, gfx.toml
#       did not reach the encoder and the run says nothing.
#   (b) ackslot records must appear in cycles where the OLD build
#       emitted nothing — that is the whole change. Zero ackslot
#       records with the frontier advancing is a red result.
#   (c) the RTT must be verified BY MEASUREMENT through the RDP port
#       before the leg, by netem_rtt.sh, and recorded in the capture.
#
# XRDP_GFX_FRAMES_IN_FLIGHT = 1 is still set in the manifest even though
# the eager path never reads it. It survives in exactly one place — the
# 'send' perf record's sixth field — and pinning it to 1 keeps that
# field meaning the same thing it meant on x017, so the two arms' send
# records can be read side by side.
[codec]
order = [ "H.264", "RFX" ]

# Specify a preferred H.264 encoder, "x264" or "OpenH264".
# This parameter takes effect only when more than one encoder is
# enabled at compile time. If only one encoder is enabled, the encoder
# will be used regardless the value of this parameter.
h264_encoder = "ffmpeg"

# Hardware H.264 via VAAPI (Intel/AMD render node). ffmpeg runs as root under
# xrdp so it can open /dev/dri/renderD128; frames arrive as system-memory NV12,
# so they are uploaded to the GPU (-vf format=nv12,hwupload) before h264_vaapi.
# -bf 0 -async_depth 1 keep the one-in/one-out cadence the pipelined runner wants.
[avc444_ffmpeg]
path = "/usr/bin/ffmpeg"
avc_mode = "444"
tail_flush = false
# EXPERIMENTAL FR-H264-8: aux-refs-aux via long-term reference slots
aux_ltr_chain = true
# BACKLOG #70 -- the EAGER arm: ack at max(absorb N, egress N-1).
# arm-u and arm-v run the SAME xrdp and xorgxrdp debs and differ in
# this one line, so the A/B isolates the ack emission point and
# nothing else.
eager_slot_ack = true
# BACKLOG #80 / PRD FR-FLOW-1: the wire window C. With
# eager_slot_ack = true this is the ONLY client-side term in the credit
# frontier, and it replaces XRDP_GFX_FRAMES_IN_FLIGHT as the thing that
# bounds what the client holds. C = 1 here so this arm is comparable
# frame-for-frame with x017, which ran XRDP_GFX_FRAMES_IN_FLIGHT = 1.
wire_window = 1
# BACKLOG #70B / PRD FR-ACK-2: EGFX assembly on its own thread,
# joined after submit(N+1) and before collect(N+1).
emit_thread = true

# BACKLOG #45 / PRD FR-H264-6: scheduled paired intra refresh, in
# pictures per view. The runner spawns BOTH children with the identical
# frame-indexed -force_key_frames schedule and pins -g to the same value
# (D7), so every intra picture lands on a scheduled index and the
# rewriter can check observed against requested.
intra_refresh_frames = 240
encoder_args = [
  "-vaapi_device", "/dev/dri/renderD128",
  "-vf", "format=nv12,hwupload",
  "-c:v", "h264_vaapi",
  "-rc_mode", "CQP", "-qp", "20",
  "-bf", "0", "-async_depth", "1",
  # BACKLOG #45 step 4 retires the `-g 30000` interim: with the
  # scheduled paired intra refresh a mid-stream IDR no longer empties
  # the DPB, so a long GOP is no longer the thing keeping LT1 alive.
  # The runner PINS -g to intra_refresh_frames itself (D7) and appends
  # it after this block, so any -g written here is overridden; it is
  # left out rather than left misleading.
]
[x264.default]
# NOTE: x264 specifies bitrate in unit of kbps.
preset = "ultrafast"
tune = "zerolatency"
profile = "main"     # profile is forced to baseline if preset == ultrafast
vbv_max_bitrate = 0
vbv_buffer_size = 0
fps_num = 60
fps_den = 1
threads = 1          # recommended: 1 or 2, see `man gfx.toml` for details

[x264.lan]
# inherits default

[x264.wan]
vbv_max_bitrate = 15_000
vbv_buffer_size = 1_500

[x264.broadband_high]
preset = "superfast"
vbv_max_bitrate = 8_000
vbv_buffer_Size = 800

[x264.satellite]
preset = "superfast"
vbv_max_bitrate = 5_000
vbv_buffer_size = 500

[x264.broadband_low]
preset = "veryfast"
vbv_max_bitrate = 1_600
vbv_buffer_size = 66

[x264.modem]
preset = "fast"
vbv_max_bitrate = 1_200
vbv_buffer_size = 50

#
# Configurations for OpenH264
#
[OpenH264.default]
# NOTE: OpenH264 specifies bitrate in unit of bps, not kbps.
EnableFrameSkip = false
TargetBitrate = 20_000_000
MaxBitrate =    0          # unspecified
MaxFrameRate = 60.0

[OpenH264.lan]
# inherits default

[OpenH264.wan]
TargetBitrate = 10_000_000
MaxBitrate =    12_000_000

[OpenH264.broadband_high]
EnableFrameSkip = true
TargetBitrate = 8_000_000
MaxBitrate =   10_000_000

[OpenH264.satellite]
EnableFrameSkip = true
TargetBitrate = 4_000_000
MaxBitrate =    6_000_000

[OpenH264.broadband_low]
EnableFrameSkip = true
TargetBitrate = 1_600_000
MaxBitrate =    1_800_000

[OpenH264.modem]
EnableFrameSkip = true
TargetBitrate =   600_000
MaxBitrate =    1_200_000

