# Ubuntu 24.04 / FFmpeg 6 CPU auxiliary-leaf qualification.
# This is a dense AVC444v2, one-frame-window configuration:
# sparse chroma, auxiliary LTR references and eager acknowledgement are not
# involved in the rejected leaf transform being reproduced.
[codec]
order = [ "H.264", "RFX" ]
h264_encoder = "ffmpeg"

[avc444_ffmpeg]
path = "/usr/bin/ffmpeg"
avc_mode = "444"
aux_ltr_chain = false
eager_slot_ack = false
wire_window = 1
chroma_refresh_ms = 0
chroma_idle_ms = 0
encoder_args = [
  "-c:v", "libx264",
  "-bf", "0",
  "-preset", "ultrafast",
  "-tune", "zerolatency",
  "-crf", "18",
  "-g", "240",
  # Deliberately preserve the affected operator arguments. With ultrafast,
  # omitting cabac=1 emits Constrained Baseline/CAVLC. The frontier confirms
  # AVC and fails after login; the repaired capability gate refuses it.
  "-x264-params", "repeat-headers=1:aud=1",
]
