# ARM P (host port 40015) — the frame_num-wrap re-key arm (PRD
# FR-H264-8). arm-n's LTR aux-chain config with ltr_rekey_frame_num
# lowered from the shipped 65024 to 536, so a boundary arrives every
# ~268 encoded frames instead of after ~18 min of continuous animation.
# This is the SHIPPED re-key shape: bitstream-only, no EGFX surface
# lifecycle event (ltr_rekey_surface_reset defaults to false).
#
# Why this arm exists. The re-key is needed for exactly ONE reason: to
# keep the shared frame_num counter away from its 2^16 wrap, which is
# undefined behaviour we are hiding from the client. Everything else
# #48 did -- deleting and recreating the EGFX surface to force a
# protocol-defined decoder teardown -- was belt-and-braces, and it is
# what macOS renders as a black flash at every boundary. Measured
# 2026-07-29 in BOTH emission orders:
#   DELETE -> CREATE -> MAP -> pixels   (maps a blank surface) -> black
#   CREATE -> pixels -> MAP -> DELETE   (never blank)          -> black
# The oracle capture from the second decodes 4122/4122 pictures with
# ZERO black frames, so the black is not in the H.264 at all: the
# client blanks on surface CHURN itself. That falsifies #48's founding
# premise, that a surface delete is an event class every client already
# survives.
#
# So here the encoder pair is still destroyed and rebuilt at the
# threshold -- the replacement child opens with a real IDR and the
# shared counter resets, which is the whole point -- and the client
# sees an ordinary full-surface repaint and no surface event.
#
# Acceptance:
#   * offline gate FIRST: oracle_black_frame_check.py must report every
#     picture decoded and no mid-stream black frame;
#   * wire: no CREATE_SURFACE / DELETE_SURFACE / MAP_SURFACE_TO_OUTPUT
#     after the connect-time pair, the re-key frame's damage covers the
#     whole surface, and its main view is an IDR with frame_num reset;
#   * onscreen (only after the gate): no black flash at a boundary.
[codec]
order = [ "H.264", "RFX" ]

# Specify a preferred H.264 encoder, "x264" or "OpenH264".
# This parameter takes effect only when more than one encoder is
# enabled at compile time. If only one encoder is enabled, the encoder
# will be used regardless the value of this parameter.
h264_encoder = "ffmpeg"

# Hardware H.264 via VAAPI (Intel/AMD render node). ffmpeg runs as root under
# xrdp so it can open /dev/dri/renderD128; frames arrive as system-memory NV12,
# so they are uploaded to the GPU (-vf format=nv12,hwupload) before h264_vaapi.
# -bf 0 -async_depth 1 keep the one-in/one-out cadence the pipelined runner wants.
[avc444_ffmpeg]
path = "/usr/bin/ffmpeg"
avc_mode = "444"
tail_flush = false
# EXPERIMENTAL FR-H264-8: aux-refs-aux via long-term reference slots
aux_ltr_chain = true
# BACKLOG #48: lowered re-key threshold — TEST ARM ONLY. Shipped default
# is 65024 (2^16-512). The server logs a WARNING whenever this is below
# the default so a lowered value can never be mistaken for production.
ltr_rekey_frame_num = 536
# mask the surface churn from the client (see header)
ltr_rekey_surface_reset = false
encoder_args = [
  "-vaapi_device", "/dev/dri/renderD128",
  "-vf", "format=nv12,hwupload",
  "-c:v", "h264_vaapi",
  "-rc_mode", "CQP", "-qp", "20",
  "-bf", "0", "-async_depth", "1",
  # NOTE (2026-07-29): the inherited claim that "-g 30000 makes epochs
  # coincide with re-keys" is WRONG by the factor of 2 between pairs and
  # the shared frame_num. -g 30000 => a main IDR every 30000 pairs =>
  # shared counter 60000, below the 65024 default threshold, so the
  # re-key can never fire at the default. It fires here only because
  # ltr_rekey_frame_num is lowered to 536 (boundary at pair 268).
  # FR-H264-8: long GOP. Mid-stream main IDRs empty the DPB (LT1 dies),
  # forcing an aux-child respawn and starting a new topology-3 epoch
  # every GOP (vaapi default gop=120 = every ~12 s). With a reliable
  # transport periodic IDRs buy nothing (real Windows ships ONE IDR per
  # session); -g 30000 makes epochs coincide with re-keys (~hourly).
  # A/B caveat vs arm-m recorded in BACKLOG: arm-m still pays its
  # per-120-frame main IDR; the gate metric (aux KB/frame) is unaffected.
  "-g", "30000",
]
[x264.default]
# NOTE: x264 specifies bitrate in unit of kbps.
preset = "ultrafast"
tune = "zerolatency"
profile = "main"     # profile is forced to baseline if preset == ultrafast
vbv_max_bitrate = 0
vbv_buffer_size = 0
fps_num = 60
fps_den = 1
threads = 1          # recommended: 1 or 2, see `man gfx.toml` for details

[x264.lan]
# inherits default

[x264.wan]
vbv_max_bitrate = 15_000
vbv_buffer_size = 1_500

[x264.broadband_high]
preset = "superfast"
vbv_max_bitrate = 8_000
vbv_buffer_Size = 800

[x264.satellite]
preset = "superfast"
vbv_max_bitrate = 5_000
vbv_buffer_size = 500

[x264.broadband_low]
preset = "veryfast"
vbv_max_bitrate = 1_600
vbv_buffer_size = 66

[x264.modem]
preset = "fast"
vbv_max_bitrate = 1_200
vbv_buffer_size = 50

#
# Configurations for OpenH264
#
[OpenH264.default]
# NOTE: OpenH264 specifies bitrate in unit of bps, not kbps.
EnableFrameSkip = false
TargetBitrate = 20_000_000
MaxBitrate =    0          # unspecified
MaxFrameRate = 60.0

[OpenH264.lan]
# inherits default

[OpenH264.wan]
TargetBitrate = 10_000_000
MaxBitrate =    12_000_000

[OpenH264.broadband_high]
EnableFrameSkip = true
TargetBitrate = 8_000_000
MaxBitrate =   10_000_000

[OpenH264.satellite]
EnableFrameSkip = true
TargetBitrate = 4_000_000
MaxBitrate =    6_000_000

[OpenH264.broadband_low]
EnableFrameSkip = true
TargetBitrate = 1_600_000
MaxBitrate =    1_800_000

[OpenH264.modem]
EnableFrameSkip = true
TargetBitrate =   600_000
MaxBitrate =    1_200_000

