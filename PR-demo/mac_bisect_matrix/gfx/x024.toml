# ARM x021 (host port 40037) — the TREATMENT half of the merged eager-ack
# A/B (owner-approved 2026-08-06): eager_slot_ack = true with
# wire_window = 2, the value the code ships as its default and which has
# NEVER been run live in this tree.
#
# THE PAIR, AND THE ONE CONFIG LINE THAT DIFFERS.
#   x020  eager_slot_ack = false -> xrdp_mm_emit_legacy_frame_ack()
#         (xrdp/xrdp_mm.c:1764). ONE region ack (flags 0), emitted only
#         while xrdp_gfx_ack_window_open(frame_id_client,
#         frame_id_server, frames_in_flight) is true. When the client
#         falls behind by the window, the producer is told NOTHING at
#         all -- capture stops on a fact about the network.
#   x021  eager_slot_ack = true, wire_window = 2 ->
#         xrdp_mm_emit_credit_frontier() (xrdp/xrdp_mm.c:1701). The
#         frontier is emitted UNCONDITIONALLY as
#         min(frame_id_consumed, frame_id_server + 1,
#             frame_id_client + C); when the client falls behind, the
#         slot ack still goes out and only the region term is clamped.
#
# BOTH ARMS ALLOW THE CLIENT TO FALL BEHIND BY 2 FRAMES, AND THEY REACH
# THAT 2 THROUGH DIFFERENT MECHANISMS. THIS IS THE EXPERIMENT, NOT A
# CONFOUND. On x020 the 2 is the environment variable
# XRDP_GFX_FRAMES_IN_FLIGHT, pinned to 2 in k8s/x020.yaml (it is also
# the binary's built-in default, DEFAULT_XRDP_GFX_FRAMES_IN_FLIGHT = 2,
# xrdp/xrdp_encoder.c:51 -- the manifest states it rather than relying
# on it). On x021 the 2 is gfx.toml's wire_window, the credit
# frontier's client term (XRDP_GFX_WIRE_WINDOW_DEFAULT = 2,
# xrdp/xrdp_tconfig.h:43). Holding the NUMBER equal at 2 on both sides
# is what makes the comparison about the ack MECHANISM -- withhold
# everything versus clamp the credit -- instead of about window size.
# A reader who sees "one arm's window comes from an env var and the
# other's from a toml key" and calls it a confound has it backwards:
# the confound would be running the legacy arm at 2 and the eager arm
# at 1, which is what every previous eager capture in this tree did.
#
# XRDP_GFX_FRAMES_IN_FLIGHT = 2 IS STILL SET IN k8s/x021.yaml even
# though this arm's ack path never reads it (xrdp_mm.c:1800 branches on
# eager_slot_ack and never reaches the legacy gate). It survives in
# exactly one place -- the 'send' perf record's sixth field, which is
# encoder->frames_in_flight (xrdp_mm.c:4308) -- and pinning it to the
# same 2 x020 uses keeps that field meaning the same thing on both
# arms, so the two arms' send records can be read side by side.
#
# WHY wire_window = 2 HAS NEVER BEEN RUN LIVE. Every wire_window in
# this tree -- gfx/x018.toml, gfx/x019.toml and every archived capture
# under captures/ -- is 1, chosen so those arms were frame-for-frame
# comparable with x017's XRDP_GFX_FRAMES_IN_FLIGHT = 1. The value the
# code SHIPS as its default has therefore never encoded a frame. This
# arm is the first run of it.
#
# BUILD. Same image as x018/x019/x020 (localhost/xrdp-bisect:
# 1d5bc0960db8.xx10fa3aa-tf), same xorgxrdp (10fa3aa23033), same
# payload (SESSION_KIND=textflood), same geometry, same client rig.
# Nothing is compiled for this pair: both arms are config-only, so a
# build difference cannot enter the comparison.
#
# MECHANISM CHECKS BEFORE ANY RATE (quality gate 2). Read them off the
# perf ring, not off the config:
#   (a) 'ackslot' records must be PRESENT. They exist only on the
#       credit-frontier path; zero of them while the frontier advances
#       is a red result, not a rate to report.
#   (b) every 'ackslot' and 'ackregion' record has field e = 2. Field e
#       is encoder->wire_window at the call site (xrdp_mm.c:1729 and
#       :1745). If it reads 1, this pod is running an older gfx.toml
#       (every other arm in the tree is 1) and the run says nothing; if
#       it reads 0, the legacy path ran and this is not the treatment.
#   (c) every 'send' record has field f = 2 -- the same check x020 gets,
#       so the sixth field means the same thing on both arms.
[codec]
order = [ "H.264", "RFX" ]

# Specify a preferred H.264 encoder, "x264" or "OpenH264".
# This parameter takes effect only when more than one encoder is
# enabled at compile time. If only one encoder is enabled, the encoder
# will be used regardless the value of this parameter.
h264_encoder = "ffmpeg"

# Hardware H.264 via VAAPI (Intel/AMD render node). ffmpeg runs as root under
# xrdp so it can open /dev/dri/renderD128; frames arrive as system-memory NV12,
# so they are uploaded to the GPU (-vf format=nv12,hwupload) before h264_vaapi.
# -bf 0 -async_depth 1 keep the one-in/one-out cadence the pipelined runner wants.
[avc444_ffmpeg]
path = "/usr/bin/ffmpeg"
avc_mode = "444"
tail_flush = false
# EXPERIMENTAL FR-H264-8: aux-refs-aux via long-term reference slots
aux_ltr_chain = true
# BACKLOG #70 -- THE LINE UNDER TEST in the x020/x021 pair: false on
# x020 (control, the shipped gated ack) and true on x021 (treatment,
# the credit frontier). It is the ONLY line that differs between the
# two files below their header comments.
eager_slot_ack = true
# BACKLOG #80 / PRD FR-FLOW-1: the wire window C = 2, the value the
# code ships as its default (XRDP_GFX_WIRE_WINDOW_DEFAULT). Written on
# BOTH arms so the bodies differ by exactly one line; it is consulted
# only on the eager path, so on x020 it is inert. See the header.
wire_window = 1
# BACKLOG #70B / PRD FR-ACK-2: EGFX assembly on its own thread,
# joined after submit(N+1) and before collect(N+1).
emit_thread = false

# BACKLOG #45 / PRD FR-H264-6: scheduled paired intra refresh, in
# pictures per view. The runner spawns BOTH children with the identical
# frame-indexed -force_key_frames schedule and pins -g to the same value
# (D7), so every intra picture lands on a scheduled index and the
# rewriter can check observed against requested.
intra_refresh_frames = 240
encoder_args = [
  "-vaapi_device", "/dev/dri/renderD128",
  "-vf", "format=nv12,hwupload",
  "-c:v", "h264_vaapi",
  "-rc_mode", "CQP", "-qp", "20",
  "-bf", "0", "-async_depth", "1",
  # BACKLOG #45 step 4 retires the `-g 30000` interim: with the
  # scheduled paired intra refresh a mid-stream IDR no longer empties
  # the DPB, so a long GOP is no longer the thing keeping LT1 alive.
  # The runner PINS -g to intra_refresh_frames itself (D7) and appends
  # it after this block, so any -g written here is overridden; it is
  # left out rather than left misleading.
]
[x264.default]
# NOTE: x264 specifies bitrate in unit of kbps.
preset = "ultrafast"
tune = "zerolatency"
profile = "main"     # profile is forced to baseline if preset == ultrafast
vbv_max_bitrate = 0
vbv_buffer_size = 0
fps_num = 60
fps_den = 1
threads = 1          # recommended: 1 or 2, see `man gfx.toml` for details

[x264.lan]
# inherits default

[x264.wan]
vbv_max_bitrate = 15_000
vbv_buffer_size = 1_500

[x264.broadband_high]
preset = "superfast"
vbv_max_bitrate = 8_000
vbv_buffer_Size = 800

[x264.satellite]
preset = "superfast"
vbv_max_bitrate = 5_000
vbv_buffer_size = 500

[x264.broadband_low]
preset = "veryfast"
vbv_max_bitrate = 1_600
vbv_buffer_size = 66

[x264.modem]
preset = "fast"
vbv_max_bitrate = 1_200
vbv_buffer_size = 50

#
# Configurations for OpenH264
#
[OpenH264.default]
# NOTE: OpenH264 specifies bitrate in unit of bps, not kbps.
EnableFrameSkip = false
TargetBitrate = 20_000_000
MaxBitrate =    0          # unspecified
MaxFrameRate = 60.0

[OpenH264.lan]
# inherits default

[OpenH264.wan]
TargetBitrate = 10_000_000
MaxBitrate =    12_000_000

[OpenH264.broadband_high]
EnableFrameSkip = true
TargetBitrate = 8_000_000
MaxBitrate =   10_000_000

[OpenH264.satellite]
EnableFrameSkip = true
TargetBitrate = 4_000_000
MaxBitrate =    6_000_000

[OpenH264.broadband_low]
EnableFrameSkip = true
TargetBitrate = 1_600_000
MaxBitrate =    1_800_000

[OpenH264.modem]
EnableFrameSkip = true
TargetBitrate =   600_000
MaxBitrate =    1_200_000

