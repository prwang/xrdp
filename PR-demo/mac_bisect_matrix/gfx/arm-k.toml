# ARM K (host port 40010) — FAULT INJECTION: G-clean CQP config plus
# fault_aux_delay=true (xrdp 8b8d17c2636a): the server DELIBERATELY ships
# each frame's main with the PREVIOUS frame's aux — a one-frame chroma
# pairing slip modeling hypothesis A (decoder-side main/aux association
# error). Compare the visual signature against the T4 symptom (full
# screen wedge + discolor at connect). Output is intentionally wrong: the exact Mac-good
# build (52099149, pre metablock-even-align/4B) and Mac-good VAAPI CQP
# config, but avc_mode="444". The T4 (current dev branch) renders 444 on
# the Mac with WRONG COLORS (regional hue casts = aux chroma misassembly
# suspect) while xfreerdp/mstsc render the same wire correctly.
# CORRECT COLORS here => 444 packing regressed in 52099149..bd1ab35b
# (prime suspect: f0104284 metablock even-align) — bisect arms follow.
# WRONG COLORS here => Mac-444 color fidelity was never validated;
# investigate Mac's ChromaV2 interpretation vs ours instead.
[codec]
order = [ "H.264", "RFX" ]

# Specify a preferred H.264 encoder, "x264" or "OpenH264".
# This parameter takes effect only when more than one encoder is
# enabled at compile time. If only one encoder is enabled, the encoder
# will be used regardless the value of this parameter.
h264_encoder = "ffmpeg"

# Hardware H.264 via VAAPI (Intel/AMD render node). ffmpeg runs as root under
# xrdp so it can open /dev/dri/renderD128; frames arrive as system-memory NV12,
# so they are uploaded to the GPU (-vf format=nv12,hwupload) before h264_vaapi.
# -bf 0 -async_depth 1 keep the one-in/one-out cadence the pipelined runner wants.
[avc444_ffmpeg]
path = "/usr/bin/ffmpeg"
avc_mode = "444"
fault_aux_delay = true
tail_flush = false
encoder_args = [
  "-vaapi_device", "/dev/dri/renderD128",
  "-vf", "format=nv12,hwupload",
  "-c:v", "h264_vaapi",
  "-rc_mode", "CQP", "-qp", "20",
  "-bf", "0", "-async_depth", "1",
]

[x264.default]
# NOTE: x264 specifies bitrate in unit of kbps.
preset = "ultrafast"
tune = "zerolatency"
profile = "main"     # profile is forced to baseline if preset == ultrafast
vbv_max_bitrate = 0
vbv_buffer_size = 0
fps_num = 60
fps_den = 1
threads = 1          # recommended: 1 or 2, see `man gfx.toml` for details

[x264.lan]
# inherits default

[x264.wan]
vbv_max_bitrate = 15_000
vbv_buffer_size = 1_500

[x264.broadband_high]
preset = "superfast"
vbv_max_bitrate = 8_000
vbv_buffer_Size = 800

[x264.satellite]
preset = "superfast"
vbv_max_bitrate = 5_000
vbv_buffer_size = 500

[x264.broadband_low]
preset = "veryfast"
vbv_max_bitrate = 1_600
vbv_buffer_size = 66

[x264.modem]
preset = "fast"
vbv_max_bitrate = 1_200
vbv_buffer_size = 50

#
# Configurations for OpenH264
#
[OpenH264.default]
# NOTE: OpenH264 specifies bitrate in unit of bps, not kbps.
EnableFrameSkip = false
TargetBitrate = 20_000_000
MaxBitrate =    0          # unspecified
MaxFrameRate = 60.0

[OpenH264.lan]
# inherits default

[OpenH264.wan]
TargetBitrate = 10_000_000
MaxBitrate =    12_000_000

[OpenH264.broadband_high]
EnableFrameSkip = true
TargetBitrate = 8_000_000
MaxBitrate =   10_000_000

[OpenH264.satellite]
EnableFrameSkip = true
TargetBitrate = 4_000_000
MaxBitrate =    6_000_000

[OpenH264.broadband_low]
EnableFrameSkip = true
TargetBitrate = 1_600_000
MaxBitrate =    1_800_000

[OpenH264.modem]
EnableFrameSkip = true
TargetBitrate =   600_000
MaxBitrate =    1_200_000

