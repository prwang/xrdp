# ARM O (host port 40014) — BACKLOG #48: the re-key BOUNDARY arm.
# Identical to arm-n (FR-H264-8 LTR aux-chain, VAAPI CQP 444) except
# for one knob: ltr_rekey_frame_num is lowered from the shipped 65024
# to 536, so the re-key boundary — encoder-pair rebuild + EGFX surface
# delete/create + full repaint from a fresh IDR — arrives every ~268
# encoded frames (a few seconds of animation) instead of after ~18 min
# of continuous 30 fps animation.
#
# Why an arm and not a stopwatch: the boundary is the one place where
# the wire leaves the steady LTR chain, and it used to depend on an
# UNVERIFIED client behaviour (would a 2-context decoder re-initialise
# its aux context at an in-band epoch change?). It no longer does — the
# surface delete is a protocol-defined decoder teardown — but that has
# to be demonstrated, not asserted, and nobody should have to watch a
# session for 18 minutes to see it once.
#
# Acceptance (BACKLOG #48):
#   * wire: DELETE_SURFACE / CREATE_SURFACE / MAP_SURFACE_TO_OUTPUT
#     precede the first PDU of the re-key frame, that frame's damage
#     region covers the whole surface, and its main view is an IDR with
#     the shared frame_num reset (tools/avc444_ltr_wire_audit.py);
#   * onscreen: normal rendering across many consecutive boundaries on
#     the standard client matrix (mstsc, mstsc multimon, macOS Windows
#     App), with no wedge, no colour break and no stuck frame.
[codec]
order = [ "H.264", "RFX" ]

# Specify a preferred H.264 encoder, "x264" or "OpenH264".
# This parameter takes effect only when more than one encoder is
# enabled at compile time. If only one encoder is enabled, the encoder
# will be used regardless the value of this parameter.
h264_encoder = "ffmpeg"

# Hardware H.264 via VAAPI (Intel/AMD render node). ffmpeg runs as root under
# xrdp so it can open /dev/dri/renderD128; frames arrive as system-memory NV12,
# so they are uploaded to the GPU (-vf format=nv12,hwupload) before h264_vaapi.
# -bf 0 -async_depth 1 keep the one-in/one-out cadence the pipelined runner wants.
[avc444_ffmpeg]
path = "/usr/bin/ffmpeg"
avc_mode = "444"
tail_flush = false
# EXPERIMENTAL FR-H264-8: aux-refs-aux via long-term reference slots
aux_ltr_chain = true
# BACKLOG #48: lowered re-key threshold — TEST ARM ONLY. Shipped default
# is 65024 (2^16-512). The server logs a WARNING whenever this is below
# the default so a lowered value can never be mistaken for production.
ltr_rekey_frame_num = 536
# BACKLOG #48 CONTROL: opt back IN to the EGFX surface teardown, which
# is the known-bad behaviour (macOS flashes black at every boundary).
# Retained deliberately so arm-o vs arm-p is a one-knob A/B.
ltr_rekey_surface_reset = true
encoder_args = [
  "-vaapi_device", "/dev/dri/renderD128",
  "-vf", "format=nv12,hwupload",
  "-c:v", "h264_vaapi",
  "-rc_mode", "CQP", "-qp", "20",
  "-bf", "0", "-async_depth", "1",
  # NOTE (2026-07-29): the inherited claim that "-g 30000 makes epochs
  # coincide with re-keys" is WRONG by the factor of 2 between pairs and
  # the shared frame_num. -g 30000 => a main IDR every 30000 pairs =>
  # shared counter 60000, below the 65024 default threshold, so the
  # re-key can never fire at the default. It fires here only because
  # ltr_rekey_frame_num is lowered to 536 (boundary at pair 268).
  # FR-H264-8: long GOP. Mid-stream main IDRs empty the DPB (LT1 dies),
  # forcing an aux-child respawn and starting a new topology-3 epoch
  # every GOP (vaapi default gop=120 = every ~12 s). With a reliable
  # transport periodic IDRs buy nothing (real Windows ships ONE IDR per
  # session); -g 30000 makes epochs coincide with re-keys (~hourly).
  # A/B caveat vs arm-m recorded in BACKLOG: arm-m still pays its
  # per-120-frame main IDR; the gate metric (aux KB/frame) is unaffected.
  "-g", "30000",
]
[x264.default]
# NOTE: x264 specifies bitrate in unit of kbps.
preset = "ultrafast"
tune = "zerolatency"
profile = "main"     # profile is forced to baseline if preset == ultrafast
vbv_max_bitrate = 0
vbv_buffer_size = 0
fps_num = 60
fps_den = 1
threads = 1          # recommended: 1 or 2, see `man gfx.toml` for details

[x264.lan]
# inherits default

[x264.wan]
vbv_max_bitrate = 15_000
vbv_buffer_size = 1_500

[x264.broadband_high]
preset = "superfast"
vbv_max_bitrate = 8_000
vbv_buffer_Size = 800

[x264.satellite]
preset = "superfast"
vbv_max_bitrate = 5_000
vbv_buffer_size = 500

[x264.broadband_low]
preset = "veryfast"
vbv_max_bitrate = 1_600
vbv_buffer_size = 66

[x264.modem]
preset = "fast"
vbv_max_bitrate = 1_200
vbv_buffer_size = 50

#
# Configurations for OpenH264
#
[OpenH264.default]
# NOTE: OpenH264 specifies bitrate in unit of bps, not kbps.
EnableFrameSkip = false
TargetBitrate = 20_000_000
MaxBitrate =    0          # unspecified
MaxFrameRate = 60.0

[OpenH264.lan]
# inherits default

[OpenH264.wan]
TargetBitrate = 10_000_000
MaxBitrate =    12_000_000

[OpenH264.broadband_high]
EnableFrameSkip = true
TargetBitrate = 8_000_000
MaxBitrate =   10_000_000

[OpenH264.satellite]
EnableFrameSkip = true
TargetBitrate = 4_000_000
MaxBitrate =    6_000_000

[OpenH264.broadband_low]
EnableFrameSkip = true
TargetBitrate = 1_600_000
MaxBitrate =    1_800_000

[OpenH264.modem]
EnableFrameSkip = true
TargetBitrate =   600_000
MaxBitrate =    1_200_000

